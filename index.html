/* ================= STARTUPS (VC) ================= */
/* Chaque startup a une qualité cachée (équipe + vraie traction + part d'aléa). Ce qu'on voit : équipe (fiable), traction annoncée
   (parfois gonflée), hype (fait monter le prix d'entrée, presque pas les chances). L'audit révèle la vérité. À chaque fin de tour la
   startup lève, stagne, plonge ou meurt ; le moral de son secteur en Bourse pèse. Le joueur peut suivre les levées ou revendre. */
const SECTS=[{n:'Tech & IA',sym:'NEO'},{n:'Santé',sym:'BIO'},{n:'Luxe & conso',sym:'LUX'},{n:'Crypto',sym:'BTC'},{n:'Mobilité',sym:'VLT'},{n:'Énergie',sym:'PDN'}];
const STAGES=['Amorçage','Série A','Série B','Série C','Pré-IPO'];
function genOffers(){return Array.from({length:3},()=>{const team=RI(1,5),trac=RI(1,5),hype=RI(1,5);
  return {id:Math.random().toString(36).slice(2,8),name:pick(SNAMES),pitch:pick(CONCEPTS)+' '+pick(TARGETS),e:pick(['🚀','🧪','📦','🛸','🧃','🪐','🐣','🛰️','🧩']),
    sec:RI(0,SECTS.length-1),team,trac,tracVis:clamp(trac+pick([-1,0,0,1]),1,5),hype,q:clamp(.45*(team-1)/4+.35*(trac-1)/4+R(-.1,.3),0,1),
    min:pick([1000,5000,10000,25000,50000]),aud:[]}})}
function entryRatio(o){return clamp(1-.07*(o.team+o.tracVis-6)-.08*(o.hype-1),.45,1.1)}
function grade(q){return q>.7?'A':q>.5?'B':q>.3?'C':'D'}
function auditCost(o){return Math.max(500,niceRound(o.min*.15))}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function openVC(){openSheet('🦄 Startups non cotées',vcHTML(),()=>{$('#shBody').innerHTML=vcHTML()})}
function vcHTML(){const p=viewer(),RO=ro();
  return `${RO?RO_NOTE:''}<div class="note">Tu prends une part dans une jeune pousse. À chaque fin de tour elle peut <b>lever des fonds</b> (sa valeur grimpe), stagner, traverser une crise ou mourir. Dès la Série C, elle peut être rachetée ou entrer en Bourse : jackpot.</div>
  <details class="rules"><summary>🧠 Comment choisir</summary>
    <p><b>Équipe</b> et <b>traction</b> font la qualité cachée de la startup. La traction annoncée peut être gonflée : un <b>audit</b> révèle la vraie traction et une note de qualité de A à D.</p>
    <p><b>Prix d’entrée</b> : les belles startups et celles qui font le buzz 🔥 sont chères, ta part vaut alors moins que ta mise. La hype n’améliore presque pas les chances : une bonne équipe sans buzz, c’est la bonne affaire.</p>
    <p><b>Secteur</b> : si les analystes sont à l’achat sur son secteur en Bourse, la startup lève plus facilement et se revend mieux.</p>
    <p>Après chaque levée réussie, tu peux <b>remettre au pot</b> au nouveau prix, ou <b>revendre ta part</b> (−20 %) pour sécuriser tes gains. Plusieurs petits tickets limitent la casse.</p></details>
  ${G.offers.map(o=>{const au=(o.aud||[]).includes(p.id),s=SECTS[o.sec||0],sa=asset(s.sym),er=entryRatio(o);
    return `<div class="panel" style="margin-top:10px"><div class="row"><span style="font-size:34px">${o.e}</span><div style="flex:1"><b style="font-family:var(--display);font-weight:400">${esc(o.name)}</b><div class="small muted">${esc(o.pitch)}</div></div></div>
    <div class="kv small"><span>Secteur</span><span>${s.n} · Bourse ${adef(s.sym).e} <span class="${(sa.rating||0)>0?'pos':(sa.rating||0)<0?'neg':''}">${RATING[(sa.rating||0)+1]}</span></span></div>
    <div class="kv small"><span>Équipe</span><span class="gold">${stars(o.team)}</span></div>
    <div class="kv small"><span>Traction ${au?'(vérifiée)':'(annoncée)'}</span><span class="gold">${stars(au?o.trac:o.tracVis)}</span></div>
    <div class="kv small"><span>Hype</span><span>${'🔥'.repeat(o.hype)}</span></div>
    <div class="kv small"><span>Prix d’entrée</span><b class="${er>=.95?'pos':er<.7?'neg':''}">ta part vaut ${Math.round(er*100)} % de ta mise</b></div>
    ${au?`<div class="kv small"><span>Note d’audit</span><b class="${o.q>.5?'pos':'neg'}">${grade(o.q)}</b></div>`:''}
    <div class="row" style="margin:10px 0;gap:6px;flex-wrap:wrap"><span class="tag y">Ticket min ${fmt(o.min)}</span>${au||RO?'':`<button class="btn ghost sm" ${p.cash<auditCost(o)?'disabled':''} onclick="auditVC('${o.id}')">🔍 Audit · ${fmt(auditCost(o))}</button>`}</div>
    ${RO?'':`${amt('vc_'+o.id,p.cash,Math.min(o.min,p.cash))}<div style="margin-top:10px"><button class="btn" ${G.ap<1?'disabled':''} onclick="investVC('${o.id}')">Investir · 1 PA</button></div>`}</div>`}).join('')}
  ${vcPortfolio(p,!RO)}`}
function vcPortfolio(p,mine){const ds=p.deals.filter(d=>d.kind==='vc');if(!ds.length)return '';
  return `<h3 class="sec">Ton portefeuille de startups</h3><div class="list">${ds.map(d=>{const g=d.value-d.amt,can=d.raise===G.round;
    return `<div class="item"><span class="ic">${d.e}</span><span class="bd"><b>${esc(d.name)}</b><span class="small muted">${STAGES[d.stage]} · ${SECTS[d.sec].n} · ${esc(d.news||'')}</span>
    <div class="small">Investi ${fmt(d.amt)} · ta part vaut <b class="num">${fmt(d.value)}</b> <b class="${g>=0?'pos':'neg'}">${fmt(g,true)}</b></div>
    ${mine?`<div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn red sm" onclick="sellVC('${d.id}')">Revendre · ${fmt(d.value*.8)}</button>${can?`<button class="btn sm" ${G.ap<1||p.cash<d.follow?'disabled':''} onclick="followVC('${d.id}')">Suivre la levée · ${fmt(d.follow)} · 1 PA</button>`:''}</div>`:''}</span></div>`}).join('')}</div>`}
function auditVC(id){const p=cur(),o=G.offers.find(x=>x.id===id);if(!o)return;o.aud=o.aud||[];if(o.aud.includes(p.id))return;const c=auditCost(o);if(!canPay(p,c))return;
  p.cash-=c;p.stats.vc-=c;o.aud.push(p.id);sfx.tick();toast(`🔍 Audit de ${o.name} : note ${grade(o.q)}`);after()}
function investVC(id){const p=cur(),o=G.offers.find(x=>x.id===id),n=getAmt('vc_'+id);if(!o)return;if(n<o.min){toast('Le ticket minimum est de '+fmt(o.min),1);return}
  if(!canPay(p,n)||!useAP(1))return;p.cash-=n;
  p.deals.push({kind:'vc',id:rid(5),name:o.name,pitch:o.pitch,e:o.e,sec:o.sec||0,q:o.q,hype:o.hype,amt:n,value:n*entryRatio(o),stage:0,news:'tu viens d’entrer au capital'});
  addFeed(`investit ${fmt(n)} dans ${o.e} ${esc(o.name)}`);sfx.coin();toast(`Tu entres au capital de ${o.name} 🚀`);after()}
function sellVC(id){const p=cur(),i=p.deals.findIndex(d=>d.id===id);if(i<0)return;const d=p.deals[i],v=d.value*.8;
  p.cash+=v;p.stats.vc+=v-d.amt;p.deals.splice(i,1);addFeed(`revend sa part dans ${d.e} ${esc(d.name)} (${fmt(v)})`);sfx.coin();toast('Part revendue '+fmt(v));after()}
function followVC(id){const p=cur(),d=p.deals.find(x=>x.id===id);if(!d||d.raise!==G.round)return;const n=d.follow;if(!canPay(p,n)||!useAP(1))return;
  p.cash-=n;d.amt+=n;d.value+=n;d.raise=0;addFeed(`remet ${fmt(n)} dans ${d.e} ${esc(d.name)}`);sfx.coin();toast('Tu suis la levée de '+d.name);after()}
function vcTick(p,d,add){const s=asset(SECTS[d.sec].sym).reg||0,q=d.q;
  const pD=.03+.3*(1-q)+(d.stage===0?.04:0),pU=.05+.5*q+.06*s+.02*((d.hype||3)-3),pDn=.18*(1-q),r=Math.random();
  if(r<pD){p.stats.vc-=d.amt;add(p,`${d.e} ${d.name} fait faillite 💀 (mise ${fmt(d.amt)})`,0);return 'dead'}
  if(r<pD+pU){const m=R(1.5,2.3);d.value*=m;d.stage=Math.min(d.stage+1,4);
    if(d.stage>=3&&Math.random()<(d.stage===3?.35:.7)){const pay=d.value*R(1.1,1.6)*(1+.2*s);p.cash+=pay;p.stats.vc+=pay-d.amt;
      add(p,`${d.e} ${d.name} ${d.stage===4?'entre en Bourse 🔔':'est rachetée par un géant 🤝'} (mise ${fmt(d.amt)})`,pay);return 'exit'}
    d.news=`lève sa ${STAGES[d.stage]} (x${m.toFixed(1).replace('.',',')})`;d.raise=G.round+1;d.follow=niceRound(Math.max(500,d.amt*.5))}
  else if(r<pD+pU+pDn){d.value*=R(.45,.75);d.news='traverse une crise'}
  else{d.value*=R(.9,1.05);d.news='stagne'}
  add(p,`${d.e} ${d.name} ${d.news} · ta part ${fmt(d.value)}`,0);return 'ok'}
function vcOutcome(h){const r=Math.random()-(h-3)*.02;
  if(r<.44)return[0,'a fait faillite.'];if(r<.64)return[.6,'est rachetée à la casse.'];if(r<.82)return[2,'réussit sa levée de fonds : x2 !'];
  if(r<.93)return[4,'est rachetée : x4 !'];if(r<.99)return[10,'devient incontournable : x10 !'];return[40,'devient une LICORNE 🦄 x40 !!!']}

/* ================= JOB ================= */
function openJob(){if(!hasAP(1))return;
  openSheet('🧑‍🍳 Boulot honnête',`<p class="muted">De l’argent propre, sans risque. Et ça fait baisser ta jauge de recherche de 12 : la police aime les gens qui travaillent.</p><button class="btn" onclick="doJob()">Aller bosser · 1 PA</button>`)}
function doJob(){if(!useAP(1))return;const p=cur(),[e,t,d]=pick(JOBS),g=RI(8,30)*100;p.cash+=g;p.heat=clamp(p.heat-12,0,100);addFeed(`fait un petit boulot ${e} : ${t.toLowerCase()} (+${fmt(g)})`);forceClose();save();render();
  showCards([{k:'BOULOT HONNÊTE',e,t,d,fx:fmt(g,true)+' · 😇 −12'}])}

/* ================= HEIST ================= */
let hs={t:0,team:0,app:1};
/* [nom, bonus de réussite, part du butin, honoraires payés d'avance (fraction du butin mini)] */
const TEAMS=[['Solo',0,0,0],['Les potes',.08,.25,0],['Des pros',.16,.4,.1]];
/* [nom, bonus de réussite, multiplicateur de butin, multiplicateur de recherche] */
const APPS=[['🤫 Discret',.08,.7,.7],['🎯 Classique',0,1,1],['💥 Bourrin',-.1,1.4,1.3]];
function reconBonus(p,t){return p.recon&&p.recon.t===t&&p.recon.until>=G.round?.15:0}
function heistParts(){const p=cur(),h=HEISTS[hs.t];
  return [['Base',h.ch],['Équipe',TEAMS[hs.team][1]],['Approche',APPS[hs.app][1]],['Repérage',reconBonus(p,hs.t)],['Ta réputation policière',-p.heat/250],['Sécurité renforcée',-((G.sec&&G.sec[hs.t])||0)*.05]]}
function heistChance(){return clamp(heistParts().reduce((s,x)=>s+x[1],0),.02,.9)}
function heistCost(){const h=HEISTS[hs.t];return Math.round(h.prep+TEAMS[hs.team][3]*h.min)}
function openHeist(){if(!hasAP(1))return;const p=cur();if(rep(p)<HEISTS[hs.t].rep)hs.t=0;
  openSheet('🔫 Préparer un braquage',heistHTML(),()=>{$('#shBody').innerHTML=heistHTML()})}
function heistHTML(){const p=cur(),h=HEISTS[hs.t],ch=heistChance(),cut=TEAMS[hs.team][2],m=APPS[hs.app][2],cost=heistCost(),locked=rep(p)<h.rep,rb=reconBonus(p,hs.t);
  const parts=heistParts().filter(x=>Math.abs(x[1])>=.005);
  return `<div class="note warn">Un braquage prend <b>tout ton tour (3 PA)</b> et la préparation se paie d’avance, même si ça rate. Le butin est de l’<b>argent sale</b> : à blanchir. En cas d’échec : prison, amende de 30 % du cash, argent sale saisi.</div>
  <h3 class="sec">Cible · ta réputation ⭐ ${rep(p)}</h3><div class="list">${HEISTS.map((x,i)=>{const lk=rep(p)<x.rep,sec=(G.sec&&G.sec[i])||0;
    return `<button class="item ${hs.t===i?'sel':''} ${lk?'lock':''}" onclick="hs.t=${i};sfx.tick();refreshSheet()"><span class="ic">${lk?'🔒':x.e}</span><span class="bd"><b>${x.n}</b><span class="small muted">${fmt(x.min)} à ${fmt(x.max)} · prépa ${fmt(x.prep)}</span>
      <span class="small">${lk?`<span class="tag r">⭐ ${x.rep} requise</span> `:''}${sec?`<span class="tag r">Sécurité −${sec*5} %</span> `:''}${reconBonus(p,i)?'<span class="tag c">🔭 Repérée</span>':''}</span></span><span class="rt small">${Math.round(x.ch*100)} %</span></button>`}).join('')}</div>
  <h3 class="sec">Équipe</h3><div class="seg">${TEAMS.map((t,i)=>`<button class="${hs.team===i?'on':''}" onclick="hs.team=${i};refreshSheet()">${t[0]}<small>${t[1]?'+'+Math.round(t[1]*100)+' % · part '+Math.round(t[2]*100)+' %':'tout pour toi'}${t[3]?' · honoraires':''}</small></button>`).join('')}</div>
  <h3 class="sec">Approche</h3><div class="seg">${APPS.map((t,i)=>`<button class="${hs.app===i?'on':''}" onclick="hs.app=${i};refreshSheet()">${t[0]}<small>butin x${t[2]} · 🚨 x${t[3]}</small></button>`).join('')}</div>
  <div class="panel" style="margin-top:14px">
   ${parts.map(([l,v])=>`<div class="kv small"><span class="muted">${l}</span><span class="${v>=0?'pos':'neg'}">${v>=0?'+':'−'}${Math.round(Math.abs(v)*100)} %</span></div>`).join('')}
   <div class="kv"><span>Chances de réussite</span><b class="${ch>.5?'pos':'neg'}">${Math.round(ch*100)} %</b></div>
   <div class="kv"><span>Coût d’avance</span><b class="num">${fmt(cost)}</b></div>
   <div class="kv"><span>Butin pour toi (sale)</span><b class="dirty num">${fmt(h.min*m*(1-cut))} – ${fmt(h.max*m*(1-cut))}</b></div>
   <div class="kv"><span>Si ça rate</span><span class="neg">${h.jail}–${h.jail+1} tours de prison</span></div></div>
  ${locked?`<div class="err">Il te faut ⭐ ${h.rep} de réputation pour cette cible. Réussis d’abord des coups plus modestes.</div>`:`
  <div class="stack" style="margin-top:14px">
    <button class="btn ghost" ${G.ap<1||rb?'disabled':''} onclick="doRecon()">${rb?'🔭 Cible déjà repérée (+15 %)':'🔭 Faire un repérage · 1 PA (+15 % jusqu’au prochain tour)'}</button>
    <button class="btn red" ${G.ap<3||p.cash<cost?'disabled':''} onclick="runHeist()">🎭 Lancer le braquage · ${fmt(cost)} · 3 PA</button>
    ${G.ap<3?`<div class="small muted center">Il faut tes 3 PA : repère la cible maintenant, frappe au prochain tour.</div>`:''}
  </div>`}`}
function doRecon(){const p=cur(),h=HEISTS[hs.t];if(rep(p)<h.rep||!useAP(1))return;p.recon={t:hs.t,until:G.round+1};p.heat=clamp(p.heat+2,0,100);
  addFeed('fait des repérages discrets 🔭');sfx.tick();toast(`🔭 ${h.n} repéré(e) : +15 % jusqu’au prochain tour.`);after()}
async function runHeist(){const p=cur(),h=HEISTS[hs.t],cost=heistCost();if(busy)return;
  if(rep(p)<h.rep){toast(`Réputation ⭐ ${h.rep} requise.`,1);return}
  if(!canPay(p,cost)||!useAP(3))return;
  const ch=heistChance();p.cash-=cost;busy=true;render();
  const steps=[['🚐','Planque devant la cible…'],['🎭','Masques et gants enfilés…'],[pick(['💥','🔓','🧨']),'C’est parti !'],['🏎️','La fuite à fond sur l’autoroute…']];
  $('#shTitle').textContent=h.e+' '+h.n;$('#shBody').innerHTML=`<div class="steps" id="hsteps"></div><div id="hres"></div>`;
  for(const [e,t] of steps){const d=document.createElement('div');d.textContent=e+'  '+t;$('#hsteps').appendChild(d);tone(220,.15,'triangle',.06);buzz(30);await sleep(950)}
  const ok=Math.random()<ch;let html,hLoot=0;p.recon=null;
  if(ok){const loot=R(h.min,h.max)*APPS[hs.app][2]*(1-TEAMS[hs.team][2]);hLoot=loot;p.dirty+=loot;p.stats.crime+=loot;p.stats.heists++;p.rep=rep(p)+1;
    G.sec=G.sec||HEISTS.map(()=>0);G.sec[hs.t]+=2;p.heat=clamp(p.heat+h.heat*APPS[hs.app][3],0,100);
    html=`<div class="result w" style="font-size:22px">💰 BRAQUAGE RÉUSSI !<br><span class="num dirty">${fmt(loot,true)}</span></div><p class="muted center small">Argent sale : pense à le blanchir. Réputation ⭐ ${p.rep}. La cible renforce sa sécurité.</p>`;
    loot>100000?(sfx.big(),confetti()):sfx.win();popMoney(loot)}
  else if(Math.random()<.2){p.heat=clamp(p.heat+h.heat*.6,0,100);html=`<div class="result l">😰 Raté… mais tu t’enfuis les mains vides.</div><p class="muted center small">La préparation (${fmt(cost)}) est perdue et les flics ont ton signalement.</p>`;sfx.lose()}
  else{const fine=Math.max(0,p.cash)*.3;p.cash-=fine;const t=h.jail+RI(0,1);p.jail=t;p.heat=clamp(p.heat+h.heat,0,100);let lost='';
    if(p.net){p.net=0;lost+='<br>Ton réseau est démantelé.'}if(p.dirty>0){lost+=`<br>Argent sale saisi : ${fmt(p.dirty)}.`;p.dirty=0}
    html=`<div class="result l" style="font-size:20px">🚔 ARRÊTÉ !</div><p class="center">${h.fl}</p><p class="center muted small">Amende ${fmt(fine)} · ${t} tour${t>1?'s':''} de prison${lost}</p>`;sfx.siren();shake();buzz([300,100,300])}
  addFeed(ok?`braque ${h.e} ${h.n} et repart avec ${fmt(hLoot)} 💰`:p.jail?`se fait arrêter en braquant ${h.e} ${h.n} 🚔`:`rate son braquage (${h.n}) mais s’enfuit 🏃`);
  $('#hres').innerHTML=html+`<button class="btn ghost" onclick="busy=false;closeSheet()">Fermer</button>`;
  busy=false;save();render()}

/* ================= TRAFFIC ================= */
function openTraffic(){openSheet('💊 Trafic',trafHTML(),()=>{$('#shBody').innerHTML=trafHTML()})}
function trafHTML(){const p=cur(),lv=p.net,nx=NET[lv+1];
  return `<div class="note warn">Un réseau rapporte de l’<b>argent sale</b> à chaque tour… et fait grimper ta jauge de recherche à chaque tour aussi. Si tu te fais arrêter, il est démantelé et ton argent sale est saisi. Monter d’un échelon coûte <b>2 PA</b>.</div>
  ${lv?`<div class="panel" style="margin-top:12px"><b style="font-family:var(--display);font-weight:400">Niveau ${lv} · ${NET[lv].n}</b>
    <div class="kv"><span>Revenus/tour (sale)</span><b class="dirty num">${fmt(NET[lv].min)} – ${fmt(NET[lv].max)}</b></div><div class="kv"><span>Recherche/tour</span><b class="neg">+${NET[lv].heat}</b></div>
    <button class="btn ghost sm" style="width:100%;margin-top:8px" onclick="closeNet()">Fermer le réseau (gratuit)</button></div>`:''}
  <h3 class="sec">Les échelons</h3><div class="list">${NET.slice(1).map((n,i)=>`<div class="item ${lv===i+1?'sel':''}" style="${lv>i+1?'opacity:.45':''}"><span class="ic">${['🛴','🏚️','🚤','✈️'][i]}</span><span class="bd"><b>${n.n}</b><span class="small muted">${fmt(n.min)} – ${fmt(n.max)}/tour · 🚨 +${n.heat}/tour</span></span><span class="rt num small"><b>${fmt(n.cost)}</b></span></div>`).join('')}</div>
  ${nx?`<div style="margin-top:14px"><button class="btn red" ${G.ap<2||p.cash<nx.cost?'disabled':''} onclick="upNet()">${lv?'Monter en grade':'Se lancer'} · ${fmt(nx.cost)} · 2 PA</button></div>`:'<div class="result w">Tu es tout en haut de la chaîne alimentaire. 🦈</div>'}`}
function upNet(){const p=cur(),nx=NET[p.net+1];if(!nx||!canPay(p,nx.cost)||!useAP(2))return;p.cash-=nx.cost;p.net++;p.heat=clamp(p.heat+5,0,100);addFeed(`se lance dans le trafic : ${nx.n} 💊`);sfx.win();toast('💊 '+nx.n+' : opérationnel.');after()}
function closeNet(){const p=cur();p.net=0;toast('Réseau fermé. Tu te ranges… pour l’instant.');after()}

/* ================= LAUNDERING (free) ================= */
function launderCap(p){return Math.round(p.biz.reduce((s,b)=>s+bizDef(b.k).cost*.3*b.lvl,0)*(G.laundBoost||1))}
function dirtyHeat(d){return d>5000?Math.round(3*Math.log10(d/1000)):0}
function openLaunder(){openSheet('🧼 Blanchiment',launderHTML(),()=>{$('#shBody').innerHTML=launderHTML()})}
function launderHTML(){const p=cur(),d=p.dirty||0,cap=Math.max(0,launderCap(p)-(p.laund||0)),a=Math.min(d,cap);
  return `<div class="panel"><div class="kv"><span>Argent sale</span><b class="dirty num">${fmt(d)}</b></div>
    <div class="kv"><span>Compté dans ton patrimoine</span><span>${Math.round(DIRTY_VALUE*100)} % seulement</span></div>
    <div class="kv"><span>Risque</span><span class="neg">${d?`🚨 +${dirtyHeat(d)} par tour · saisi si arrestation`:'aucun'}</span></div></div>
  <h3 class="sec">Via tes commerces · frais 10 %</h3>
  ${p.biz.length?`<div class="small muted" style="margin-bottom:8px">Tes boîtes peuvent encore absorber <b class="gold">${fmt(cap)}</b> ce tour-ci (30 % de leur prix par niveau${G.laundBoost>1?', doublé par le paradis fiscal':''}).</div>
    ${amt('lnA',a,a)}<div style="margin-top:10px"><button class="btn green" ${!d||!cap?'disabled':''} onclick="launder(0)">Blanchir via mes commerces</button></div>`
    :`<div class="note">Il te faut une entreprise pour servir de façade. Plus elle est grosse, plus elle blanchit.</div>`}

function launder(mode){const p=cur();let n=Math.min(getAmt(mode?'lnB':'lnA'),p.dirty);if(!mode)n=Math.min(n,launderCap(p)-(p.laund||0));
  if(n<=0){toast('Rien à blanchir.',1);return}
  const fee=n*(mode?.3:.1);p.dirty-=n;if(p.dirty<1)p.dirty=0;p.cash+=n-fee;p.stats.laund=(p.stats.laund||0)+n;
  if(mode)p.heat=clamp(p.heat+5,0,100);else p.laund=(p.laund||0)+n;
  addFeed(mode?'passe chez le blanchisseur 🧼':'fait tourner ses commerces à plein régime 🧼');sfx.coin();toast(`🧼 ${fmt(n-fee)} blanchis (frais ${fmt(fee)})`);after()}

function lawyerCost(p){return Math.round(Math.max(2000,netWorth(p)*.04))}

function bankHTML(){const p=cur(),mb=maxBorrow(p),lc=lawyerCost(p);
  return `<div class="panel"><div class="kv"><span>Dette actuelle</span><b class="neg num">${fmt(p.debt)}</b></div><div class="kv"><span>Intérêts</span><span>4 % par tour</span></div><div class="kv"><span>Capacité d’emprunt</span><b class="pos num">${fmt(mb)}</b></div></div>
  <h3 class="sec">Emprunter</h3>${amt('borAmt',mb,Math.min(10000,mb))}<div style="margin-top:10px"><button class="btn green" onclick="borrow()" ${mb<=0?'disabled':''}>Emprunter</button></div>
  ${p.debt>0?`<h3 class="sec">Rembourser</h3>${amt('repAmt',Math.min(Math.max(p.cash,0),p.debt),Math.min(Math.max(p.cash,0),p.debt))}<div style="margin-top:10px"><button class="btn" onclick="repay()">Rembourser</button></div>`:''}

   <button class="btn sm" ${G.lawyer||p.heat<=0||p.cash<lc?'disabled':''} onclick="lawyer()">${fmt(lc)}</button></div>`}
function borrow(){const p=cur(),n=Math.min(getAmt('borAmt'),maxBorrow(p));if(n<=0)return;p.cash+=n;p.debt+=n;addFeed(`emprunte ${fmt(n)} à la banque 💳`);sfx.coin();toast('💳 Prêt accordé : '+fmt(n));after()}
function repay(){const p=cur(),n=Math.min(getAmt('repAmt'),p.debt,Math.max(p.cash,0));if(n<=0)return;p.cash-=n;p.debt-=n;if(p.debt<1)p.debt=0;sfx.coin();toast('Remboursé : '+fmt(n));after()}
function lawyer(){const p=cur(),c=lawyerCost(p);if(!canPay(p,c))return;p.cash-=c;p.heat=clamp(p.heat-30,0,100);G.lawyer=true;sfx.coin();toast('⚖️ Ton dossier s’est « égaré ».');after()}

/* ================= END OF ROUND ================= */
function liquidate(p,add){
  if(p.cash>=0)return;
  while(p.cash<0&&(p.pos||[]).length){const o=p.pos.pop(),v=posVal(o);p.cash+=v;p.stats.trading+=v-o.m0;add(p,'🔻 Position clôturée de force : '+adef(o.sym).name,v)}
  for(const s of Object.keys(p.stocks)){if(p.cash>=0)break;const v=p.stocks[s]*asset(s).price;p.cash+=v;delete p.stocks[s];delete p.cost[s];add(p,'🔻 Vente forcée '+ASSETS.find(x=>x.sym===s).name,v)}
  for(const x of myProps(p).sort((a,b)=>a.p-b.p)){if(p.cash>=0)break;const v=propVal(x)*.85;p.cash+=v;x.owner=null;add(p,'🔻 Saisie : '+x.n,v)}
  while(p.cash<0&&p.biz.length){const b=p.biz.pop(),v=bizVal(b)*.7;p.cash+=v;add(p,'🔻 Liquidation : '+b.name,v)}
}
function endRound(){
  const ev=Math.random()<.8?pick(EVENTS):null;
  const lines={};G.players.forEach(p=>lines[p.id]=[]);const add=(p,l,a,dv)=>lines[p.id].push({l,a,dv:dv||0});
  const m={stock:{},all:0,crypto:0,re:0,restoOff:0,bizMult:1,rentMult:1};
  G.laundBoost=1;
  if(ev)ev.f(m,add);
  const bias=G.bias||{};G.bias={};
  const paths={};
  G.assets.forEach(a=>{const d=adef(a.sym),s=(d.crypto?m.crypto:m.all)+(m.stock[a.sym]||0)+(bias[a.sym]||0);paths[a.sym]=stepAsset(a,Math.log(Math.max(.15,1+s)))});
  setEarnings();
  G.reIndex=Math.max(.3,G.reIndex*(1+.018+gauss()*.03+m.re));
  G.players.forEach(p=>{
    const rent=myProps(p).reduce((s,x)=>s+propRent(x),0)*m.rentMult;if(rent>0){p.cash+=rent;p.stats.rent+=rent;add(p,'🏠 Loyers',rent)}
    for(let i=p.biz.length-1;i>=0;i--){const b=p.biz[i],d=bizDef(b.k);
      if(Math.random()<d.fail){p.biz.splice(i,1);add(p,`💥 ${b.name} fait faillite`,0);continue}
      if(d.acq&&Math.random()<d.acq){const v=bizVal(b)*6;p.cash+=v;p.biz.splice(i,1);p.stats.biz+=v;add(p,`🤑 ${b.name} rachetée par un géant !`,v);continue}
      let inc=R(d.min,d.max)*bizMult(b.lvl)*m.bizMult;if(d.resto&&m.restoOff)inc=-d.cost*.01;
      if(d.heat)p.heat=clamp(p.heat+d.heat,0,100);
      p.cash+=inc;p.stats.biz+=inc;add(p,`${d.e} ${b.name}`,inc)}
    if(p.net){const n=NET[p.net],inc=R(n.min,n.max);p.dirty=(p.dirty||0)+inc;p.stats.crime+=inc;p.heat=clamp(p.heat+n.heat,0,100);add(p,'💊 Trafic (argent sale)',0,inc)}
    if(p.debt>0){const it=p.debt*.04;p.cash-=it;add(p,'💳 Intérêts',-it)}
    tradeTick(p,paths,add);
    for(let i=p.deals.length-1;i>=0;i--){const d=p.deals[i];
      if(d.kind==='vc'){if(vcTick(p,d,add)!=='ok')p.deals.splice(i,1);continue}
      if(d.mature<=G.round){const [mul,txt]=d.out?rollOut(d.out):vcOutcome(d.hype);const v=d.amt*mul;p.cash+=v;
      if(d.out)p.stats.biz+=v-d.amt;else p.stats.vc+=v-d.amt;p.deals.splice(i,1);add(p,`${d.e} ${d.name} ${txt}`,v)}}
    const dh=dirtyHeat(p.dirty||0);if(dh){p.heat=clamp(p.heat+dh,0,100);add(p,`💵 Argent sale qui dort : 🚨 +${dh}`,0)}
    p.heat=clamp(p.heat-7,0,100);p.laund=0;
    liquidate(p,add);
    p.hist.push(netWorth(p));
  });
  const movers=G.assets.map(a=>({d:ASSETS.find(x=>x.sym===a.sym),chg:a.chg})).sort((a,b)=>b.chg-a.chg);
  G.recap={round:G.round,ev,lines,movers,re:G.reIndex,earn:G.assets.filter(a=>a.earn).map(a=>adef(a.sym).e+' '+adef(a.sym).name)};
  G.offers=genOffers();
  G.sec=(G.sec||HEISTS.map(()=>0)).map(s=>Math.max(0,s-1));
  addFeed(`📰 Fin du tour ${G.round}${ev?' : '+ev.t.toLowerCase():''}`,null);
  G.screen='recap';
}
function rollOut(out){let r=Math.random();for(const [pr,mul,txt] of out){if((r-=pr)<0)return [mul,txt]}const l=out[out.length-1];return [l[1],l[2]]}
const PAPERS=['Le Néon du Soir','Vice Matin','Dollars & Palmiers','Le Flamant Rose','L’Écho de la Côte'];
function renderRecap(){const rc=G.recap,last=G.round>=G.maxRounds;
  $('#app').innerHTML=`<div class="paper">
    <div class="mast">${PAPERS[(rc.round-1)%PAPERS.length]}</div><div class="dateline"><span>ÉDITION DU TOUR ${rc.round}</span><span>PRIX : 2 €</span></div>
    ${rc.ev?`<div style="font-size:40px">${rc.ev.e}</div><div class="headline">${rc.ev.t}</div><p>${rc.ev.d}</p>`:`<div class="headline">CALME PLAT SUR LES MARCHÉS</div><p>Rien à signaler. Les journalistes sont partis en RTT.</p>`}
    ${rc.earn&&rc.earn.length?`<p><b>📅 Résultats trimestriels attendus au prochain tour :</b> ${rc.earn.join(', ')}.</p>`:''}
    <div class="movers">${rc.movers.map(x=>`<div><span>${x.d.e} ${x.d.name}</span><b class="${x.chg>=0?'pos':'neg'}">${pct(x.chg)}</b></div>`).join('')}<div><span>🏠 Immobilier</span><b class="${rc.re>=1?'pos':'neg'}">${pct(rc.re-1)}</b></div></div>
  </div>
  <div class="label" style="margin-top:26px">Le compte de chacun</div>
  ${ranked().map((p,i)=>{const ls=rc.lines[p.id]||[],tot=ls.reduce((s,x)=>s+x.a,0);return `<div class="pl"><div class="h"><div class="av" style="--c:${p.color}">${p.avatar}</div><b style="flex:1">${i+1}. ${esc(p.name)}</b><span class="gold num" style="font-weight:800">${fmt(netWorth(p))}</span></div>
    ${ls.length?ls.map(x=>`<div class="ln"><span>${esc(x.l)}</span><b class="num ${x.dv?'dirty':x.a>0?'pos':x.a<0?'neg':''}">${x.dv?fmt(x.dv,true)+' sale':x.a?fmt(x.a,true):''}</b></div>`).join('')+`<div class="tot"><span>Flux du tour</span><span class="num ${tot>=0?'pos':'neg'}">${fmt(tot,true)}</span></div>`:'<div class="ln"><span>Aucun revenu passif. Il serait temps d’investir.</span></div>'}</div>`}).join('')}
  <div class="dock">${canAdvance()?`<button class="btn" onclick="nextRound()">${last?'🏆 Voir le classement final':'Tour suivant ➜'}</button>`:`<div class="btn ghost" style="pointer-events:none">L’hôte lance la suite <span class="waiting" style="margin:0 0 0 6px"><i></i><i></i><i></i></span></div>`}</div>`;
}
function canAdvance(){return !ON||ON.host||!isOnline(ON.lobby&&ON.lobby.host)}
function nextRound(){if(!canAdvance())return;sfx.coin();if(G.round>=G.maxRounds){G.screen='end';save();render();setTimeout(()=>{sfx.big();confetti(200)},300);return}
  G.round++;G.turnCount=0;G.cur=(G.round-1)%G.players.length;G.screen='pass';save();render();window.scrollTo(0,0)}

/* ================= END ================= */
function renderEnd(){const rk=ranked(),top=[rk[1],rk[0],rk[2]];
  const aw=[];const best=(f,dir=1)=>{const s=G.players.slice().sort((a,b)=>dir*(f(b)-f(a)))[0];return s};
  const A=(e,t,f,dir,cond,fmtv)=>{const p=best(f,dir);const v=f(p);if(cond(v))aw.push({e,t,p,v:fmtv?fmtv(v):fmt(v,true)})};
  A('📈','Loup de Wall Street',p=>p.stats.trading,1,v=>v>0);
  A('🎰','Main de Dieu au casino',p=>p.stats.casino,1,v=>v>0);
  A('🕊️','Pigeon du casino',p=>p.stats.casino,-1,v=>v<0);
  A('🔫','Ennemi public n°1',p=>p.stats.crime,1,v=>v>0);
  A('🔒','Abonné à la prison',p=>p.stats.jailTurns,1,v=>v>0,v=>v+' tour'+(v>1?'s':'')+' en cellule');
  A('🃏','Roi de l’arnaque',p=>p.stats.scam,1,v=>v>0);
  A('🏢','Entrepreneur de l’année',p=>p.stats.biz,1,v=>v>0);
  A('🏠','Rentier en pantoufles',p=>p.stats.rent,1,v=>v>0);
  A('🦄','Flair de VC',p=>p.stats.vc,1,v=>v>0);
  A('⭐','Cerveau des braquages',p=>p.stats.heists||0,1,v=>v>0,v=>v+' coup'+(v>1?'s':'')+' réussi'+(v>1?'s':''));
  A('🧼','Roi de la lessive',p=>p.stats.laund||0,1,v=>v>0,v=>fmt(v)+' blanchis');
  $('#app').innerHTML=`<div class="logo" style="font-size:clamp(30px,10vw,44px)">FIN DE PARTIE</div>
  <p class="center muted">${G.maxRounds} tours de néons, de fric et de quelques délits.</p>
  <div class="podium">${top.map((p,i)=>p?`<div class="pod"><div class="av" style="--c:${p.color}">${p.avatar}</div><div class="nm">${esc(p.name)}</div><div class="v num">${fmt(netWorth(p))}</div><div class="blk">${[2,1,3][i]}</div></div>`:'<div class="pod"></div>').join('')}</div>
  <div class="center" style="margin:14px 0"><h2 style="text-shadow:0 0 14px var(--gold)">👑 ${esc(rk[0].name)} règne sur la ville !</h2></div>
  <div class="panel">${chartSVG()}</div>
  ${rk.length>3?`<div class="label">Le reste du banc</div><div class="list">${rk.slice(3).map((p,i)=>`<div class="item"><span class="ic">${i+4}</span><span class="bd"><b>${p.avatar} ${esc(p.name)}</b></span><b class="num">${fmt(netWorth(p))}</b></div>`).join('')}</div>`:''}
  ${aw.length?`<div class="label">Les trophées</div><div class="list">${aw.map(a=>`<div class="award"><span class="e">${a.e}</span><span class="bd" style="flex:1"><b>${a.t}</b><div class="small muted">${a.p.avatar} ${esc(a.p.name)} · ${a.v}</div></span></div>`).join('')}</div>`:''}
  <div class="dock"><div class="row" style="max-width:448px;margin:0 auto"><button class="btn ghost" onclick="openRanking()">Détails</button>${
    !ON?`<button class="btn" onclick="clearSave();G=null;APP.view='home';render()">🎲 Nouvelle partie</button>`:
    ON.host?`<button class="btn" onclick="backToLobby()">🎲 Retour au salon</button>`:`<button class="btn ghost" onclick="leaveOnline(true)">Quitter</button>`}</div></div>`}
function chartSVG(){const W=440,H=200,P=36,n=Math.max(...G.players.map(p=>p.hist.length));const all=G.players.flatMap(p=>p.hist);const mx=Math.max(...all,1),mn=Math.min(0,...all);
  const X=i=>P+i/(n-1||1)*(W-P-10),Y=v=>H-24-(v-mn)/(mx-mn||1)*(H-40);
  const grid=[0,.5,1].map(f=>{const v=mn+(mx-mn)*f;return `<line x1="${P}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(253,240,255,.12)"/><text x="${P-4}" y="${Y(v)+4}" fill="#bda7da" font-size="10" text-anchor="end">${fmt(v).replace(' €','')}</text>`}).join('');
  const lines=G.players.map(p=>`<polyline points="${p.hist.map((v,i)=>X(i)+','+Y(v)).join(' ')}" fill="none" stroke="${p.color}" stroke-width="2.5" stroke-linejoin="round"/><text x="${X(p.hist.length-1)-2}" y="${Y(p.hist[p.hist.length-1])-6}" font-size="14" text-anchor="end">${p.avatar}</text>`).join('');
  return `<div class="small muted" style="margin-bottom:6px">Évolution du patrimoine net, tour par tour</div><svg id="chart" viewBox="0 0 ${W} ${H}">${grid}${lines}<text x="${P}" y="${H-6}" fill="#bda7da" font-size="10">Départ</text><text x="${W-10}" y="${H-6}" fill="#bda7da" font-size="10" text-anchor="end">Tour ${n-1}</text></svg>`}

/* ================= BOOT ================= */
(()=>{const r=new URLSearchParams(location.search).get('room');if(r){APP.joinCode=r.toUpperCase().slice(0,4);APP.view='join'}})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ON&&ON.client&&!ON.client.connected){try{ON.client.reconnect()}catch(e){}}});
render();
</script>
</body>
</html>
