<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0221">
<title>Scarface — The world is yours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Kaushan+Script&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Scarface : Miami de nuit, années 80. Une seule couche de styles ; toute valeur passe par un token de :root.
   Exceptions justifiées en commentaire : la roue de roulette reste ronde (objet de jeu), et les couleurs des joueurs
   arrivent par la variable --c posée en ligne par le JS. */
:root{
  /* ---- Fonds, du plus profond au plus proche ---- */
  --bg-scene:#0d0221;
  --bg-scrim:rgba(8,1,22,.78);
  --surface-1:#170733;
  --surface-2:#1f0a42;
  --surface-3:#0b0320;
  --line:#3b2566;
  --ink:#fdf0ff;
  --ink-muted:#c3b1de;
  --on-neon:#14031f;              /* texte foncé posé sur un néon */

  /* ---- Néons : une couleur = un sens ---- */
  --neon-cyan:#19e6ff;            /* légal, information, action secondaire */
  --neon-pink:#ff2a8a;            /* illégal, titre de section, action principale */
  --cash:#ffd23f;                 /* argent propre */
  --dirty:#c9ff5c;                /* argent sale */
  --gain:#39ff9c;                 /* variation positive */
  --loss:#ff4d6d;                 /* perte, danger, prison */
  --loss-strong:#c8173f;          /* fond du bouton danger (contraste AA avec --ink) */

  /* ---- Dérivés techniques (dégradés, ombres) ---- */
  --chrome-hi:#ff9ccc; --chrome-mid:#ff2a8a; --chrome-low:#b80f62; --chrome-end:#ff6a9a;
  --seg-a:#ff2a8a; --seg-b:#9b5cff;
  --stripe-1:#ffd23f; --stripe-2:#ff8a3d; --stripe-3:#ff2a8a;
  --shadow-pink:#7a0c43; --shadow-red:#5c0a1d; --shadow-cyan:#0c5566; --shadow-line:#05010f;
  --halo-pink:rgba(255,42,138,.75); --halo-cyan:rgba(25,230,255,.7); --halo-cash:rgba(255,210,63,.65);
  --scan:rgba(0,0,0,.05);
  --paper:#fff4f9; --paper-ink:#1f0b2e; --paper-gain:#07703f; --paper-loss:#b0102d; --paper-grain:rgba(31,11,46,.05);
  --sky-1:#0a011c; --sky-2:#1d0544; --sky-3:#4b0c63; --sky-4:#86145f;
  --sun-1:#ffe96b; --sun-2:#ffb03b; --sun-3:#ff4f8b; --sun-4:#c4127a;
  --city:#14032e; --grid-line:rgba(255,42,138,.55); --star:#ffffff;
  --card-face:#fff7fd; --card-red:#d4145a; --card-black:#1a1a1a; --card-back-a:#3b0c6e; --card-back-b:#ff2a8a;
  --cover-a:#b8b8c8; --cover-b:#d6d6e2; --cover-ink:#333333;
  --roul-red:#c8173f; --roul-black:#1b1226; --roul-green:#0b7a4b;

  /* ---- Typographie ---- */
  --font-display:'Audiowide','Arial Black',system-ui,sans-serif;
  --font-script:'Kaushan Script','Brush Script MT',cursive;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:24px; --fs-2xl:32px; --fs-3xl:48px;
  --fs-logo:clamp(36px,calc((100vw - 40px)/7.4),60px);
  --fs-emoji-tile:28px;
  --fw-regular:400; --fw-semibold:600; --fw-bold:800;
  --lh-tight:1.15; --lh-base:1.45;
  --ls-caps:.12em; --ls-code:.18em;
  --measure:60ch;

  /* ---- Espacements (grille de 4) ---- */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px; --sp-12:48px;

  /* ---- Tailles de composants ---- */
  /* Carte de l'immobilier */
  --map-sea:#0a0418; --map-edge:rgba(25,230,255,.25);
  /* Table de poker */
  --pk-felt-1:#1d0a3d; --pk-felt-2:#07021a; --pk-seat:rgba(0,0,0,.28); --pk-line:rgba(255,255,255,.16); --card-face:#f7f2ff; --card-ink:#1b0b33; --card-red:#e0115f; --card-edge:#cfc4e6;
  /* Machine à sous */
  --slot-glass:#06020f; --slot-reel-edge:#0b0420; --slot-reel-mid:#1d0b3a; --slot-lcd:#03010a; --slot-inner:rgba(255,42,138,.12);
  --tap:44px; --btn-h:48px; --row-h:56px; --head-h:56px; --tag-h:20px; --chip-h:32px; --bar-w:3px;
  --av:44px; --av-sm:40px; --av-lg:72px; --av-xl:128px; --dot:8px; --icon:20px; --tile-emoji-box:32px;
  --sheet-max:88dvh; --app-max:480px; --ico-tile:1.6em; --ico-inline:1.15em;

  /* ---- Angles, bordures, ombres ---- */
  --radius:0; --round:50%;
  --border:1px solid var(--line);
  --shadow-offset:4px 4px 0;
  --shadow-press:2px 2px 0;
  --halo:0 0 24px; --glow-xs:4px; --glow-sm:12px; --glow-lg:32px; --blur:6px; --ring-lg:3px; --wheel-rim:6px;
  /* Les épaisseurs de trait (1 px, 2 px) font partie de la règle « bordure 1 px plein » et restent écrites telles quelles. */

  /* ---- Mouvement ---- */
  --dur-press:80ms; --dur-fast:120ms; --dur-base:200ms; --dur-slow:320ms;
  --ease-in:cubic-bezier(.2,.8,.2,1); --ease-out:cubic-bezier(.4,0,1,1);
  --grid-cell:56px; --grid-persp:260px; --grid-tilt:72deg;

  /* ---- Tailles propres à un composant ---- */
  --slant:8px; --slant-sm:4px; --stripes:8px; --pip-w:24px; --pip-h:10px; --choice-h:72px; --pill-h:28px; --free-h:64px;
  --narrow:320px; --dock-w:448px; --sheet-w:520px; --card-max:360px; --dock-space:112px; --pass-offset:160px; --city-max:760px; --switch-w:128px; --dur-jobreel:16s; --reel-item:72px; --reel-ico:48px; --switch-ico:24px; --pk-card-w:50px; --pk-card-h:72px; --card-r:4px; --dur-flip:420ms; --pin:10px;
  --wheel:144px; --card-w:50px; --card-h:72px; --reel-w:76px; --reel-h:86px; --ticket-h:150px; --chart-h:180px;
  --pod-w:120px; --pod-1st:128px; --pod-2nd:88px; --pod-3rd:64px; --pct-w:7ch; --ls-codein:.25em;
  --paper-tilt:-.8deg; --tilt:-3deg; --grain-a:4px; --grain-b:7px;
  /* ---- Boucles et animations de jeu (rythme propre, hors échelle de durées) ---- */
  --loop-bar:1.6s; --foot-btn:136px; --dur-splash:400ms;
  --loop-grid:2.4s; --loop-pulse:2s; --loop-blink:1s; --stagger:150ms; --dur-flicker:600ms; --dur-pop:1.4s; --dur-shake:400ms; --dur-reel:100ms;

  /* ---- Icônes 3D : face en dégradé (a vers b), accent du pictogramme, tranche ---- */
  --ico-glyph:#fff7fd; --ico-shadow:rgba(20,3,31,.5); --ico-hi:rgba(255,255,255,.5);
  --ico-pink-a:#ff6fb5; --ico-pink-b:#9b138f; --ico-pink-acc:#ffd23f; --ico-pink-edge:#4a0a40;
  --ico-cyan-a:#5ff4ff; --ico-cyan-b:#2b4bff; --ico-cyan-acc:#ff79c6; --ico-cyan-edge:#0b1f5c;
  --ico-gold-a:#ffe27a; --ico-gold-b:#ff6a2f; --ico-gold-acc:#ff2a8a; --ico-gold-edge:#6b2a07;
  --ico-green-a:#7dffc0; --ico-green-b:#0a9a8c; --ico-green-acc:#ffd23f; --ico-green-edge:#073f3a;
  --ico-red-a:#ff7a92; --ico-red-b:#b0102d; --ico-red-acc:#ffd23f; --ico-red-edge:#4f0716;
  --ico-violet-a:#c99bff; --ico-violet-b:#5b1fd1; --ico-violet-acc:#19e6ff; --ico-violet-edge:#25085c;
  --ico-sun-a:#ffd23f; --ico-sun-b:#ff2a8a; --ico-sun-acc:#19e6ff; --ico-sun-edge:#5c0a32;
  --ico-xl:72px; --ico-reel:56px; --ico-feed:28px; --ico-tile-box:44px;
  color-scheme:dark;
}

/* ===== Base ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg-scene);color:var(--ink);font:var(--fw-regular) var(--fs-md)/var(--lh-base) var(--font-body);overflow-x:hidden}
body.locked{overflow:hidden;position:fixed;left:0;right:0;top:var(--lock-y,0)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;border-radius:var(--radius)}
input{font:inherit;color:inherit;border-radius:var(--radius)}
:focus-visible{outline:2px solid var(--neon-cyan);outline-offset:2px}
#app{position:relative;z-index:1;max-width:var(--app-max);margin:0 auto;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + var(--sp-4)) var(--sp-4) calc(env(safe-area-inset-bottom) + var(--dock-space))}
h1,h2,h3{margin:0;font-family:var(--font-body);font-weight:var(--fw-bold);line-height:var(--lh-tight);text-wrap:balance}
p{margin:0 0 var(--sp-3);max-width:var(--measure)}
.num,.cash,.code,.amtrow input,.kv b,.kv span,.rt,.tag,.chip,.pips,.movers b,.pod .v{font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.center{text-align:center}
.small{font-size:var(--fs-sm)}
.xs{font-size:var(--fs-xs)}
.gold,.cash-c{color:var(--cash)}
.pos{color:var(--gain)} .neg{color:var(--loss)} .dirty{color:var(--dirty)}
.bold{font-weight:var(--fw-bold)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grow{flex:1}
.wrap{flex-wrap:wrap}
.full{width:100%}
.mt-0{margin-top:0}.mt-1{margin-top:var(--sp-1)}.mt-2{margin-top:var(--sp-2)}.mt-3{margin-top:var(--sp-3)}.mt-4{margin-top:var(--sp-4)}.mt-6{margin-top:var(--sp-6)}
.mb-2{margin-bottom:var(--sp-2)}.mb-3{margin-bottom:var(--sp-3)}.mb-4{margin-bottom:var(--sp-4)}
.row{display:flex;gap:var(--sp-3);align-items:center}
.row.between{justify-content:space-between}
.top.end{justify-content:space-between;margin-bottom:0}
.row.end{align-items:flex-end}
.row>.btn{flex:1}
.stack{display:flex;flex-direction:column;gap:var(--sp-3)}
.ico{width:var(--icon);height:var(--icon);flex:none;display:block}

/* ===== Décor : un seul calque fixe ===== */
/* Décor : les tailles et positions ci-dessous sont la géométrie de l'illustration (étoiles, rayures du soleil, perspective), pas des espacements d'interface. */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:layout paint;
  background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 38%,var(--sky-3) 56%,var(--sky-4) 64%,var(--bg-scene) 64%)}
#bg .stars{position:absolute;inset:0 0 40% 0;opacity:.6;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,var(--star) 50%,transparent 52%),radial-gradient(1px 1px at 28% 8%,var(--star) 50%,transparent 52%),radial-gradient(1.5px 1.5px at 44% 26%,var(--star) 50%,transparent 52%),
  radial-gradient(1px 1px at 63% 12%,var(--star) 50%,transparent 52%),radial-gradient(1.5px 1.5px at 78% 22%,var(--star) 50%,transparent 52%),radial-gradient(1px 1px at 90% 6%,var(--star) 50%,transparent 52%),
  radial-gradient(1px 1px at 8% 40%,var(--star) 50%,transparent 52%),radial-gradient(1px 1px at 55% 40%,var(--star) 50%,transparent 52%),radial-gradient(1.5px 1.5px at 86% 38%,var(--star) 50%,transparent 52%)}
#bg .sun{position:absolute;left:50%;bottom:36%;width:min(74vw,360px);aspect-ratio:1;transform:translateX(-50%);border-radius:var(--round);
  background:linear-gradient(180deg,var(--sun-1) 0%,var(--sun-2) 35%,var(--sun-3) 70%,var(--sun-4) 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 48%,transparent 48%),repeating-linear-gradient(180deg,#000 0 9px,transparent 9px 14px);
  mask-image:linear-gradient(180deg,#000 48%,transparent 48%),repeating-linear-gradient(180deg,#000 0 9px,transparent 9px 14px)}
/* Silhouette de la ville : proportions conservées (jamais recadrée), centrée sous le soleil, largeur plafonnée sur grand écran. */
#bg .city{position:absolute;left:50%;bottom:35.8%;width:min(100%,var(--city-max));height:auto;aspect-ratio:400/90;transform:translateX(-50%);color:var(--city)}
#bg .floor{position:absolute;left:0;right:0;top:64%;bottom:0;overflow:hidden;background:var(--bg-scene)}
#bg .floor::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--neon-pink);z-index:1}
#bg .plane{position:absolute;inset:0}
/* Inclinaison et défilement dans une seule transformation sur un seul élément : Safari iOS fige une animation
   placée à l'intérieur d'un parent incliné en 3D qui coupe son contenu. */
#bg .grid{position:absolute;left:-60%;right:-60%;top:0;height:260%;transform-origin:50% 0;will-change:transform;
  transform:perspective(var(--grid-persp)) rotateX(var(--grid-tilt)) translateY(calc(-1 * var(--grid-cell)));
  background-image:linear-gradient(var(--grid-line) 2px,transparent 2px),linear-gradient(90deg,var(--grid-line) 2px,transparent 2px);
  background-size:var(--grid-cell) var(--grid-cell)}
/* Le défilement est piloté en JavaScript (voir gridLoop) : Safari iOS n'anime pas toujours cette transformation en CSS. */
/* Réglage « Animations du décor » coupé : tout le décor s'immobilise. */
body.still #bg *,body.still .logo,body.still .bigav::after{animation:none!important}
#bg .scrim{position:absolute;inset:0;background:var(--bg-scrim);opacity:0;transition:opacity var(--dur-slow) var(--ease-in)}
body.dim #bg .scrim{opacity:1}
body.paused #bg *,body.away #bg *,body.paused .logo,body.away .bigav::after,body.paused .bigav::after,body.away .waiting i{animation-play-state:paused}
.scan{position:fixed;inset:0;pointer-events:none;z-index:300;background:repeating-linear-gradient(0deg,var(--scan) 0 1px,transparent 1px 3px)}

/* ===== Icônes SVG ===== */
.iconbtn{width:var(--tap);height:var(--tap);display:grid;place-items:center;background:var(--surface-1);border:var(--border);color:var(--ink)}
.iconbtn:active{transform:translate(2px,2px)}

/* ===== Boutons : quatre variantes ===== */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);width:100%;min-height:var(--btn-h);padding:0 var(--sp-4);
  font:var(--fw-bold) var(--fs-md)/var(--lh-tight) var(--font-body);text-align:center;
  transition:transform var(--dur-press) var(--ease-in)}
.btn .cost{font-weight:var(--fw-semibold);font-variant-numeric:tabular-nums;opacity:.8;white-space:nowrap}
.btn-primary{color:var(--on-neon);border:1px solid var(--chrome-hi);
  background:linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome-mid) 46%,var(--chrome-low) 50%,var(--chrome-end) 100%);
  box-shadow:var(--shadow-offset) var(--shadow-pink)}
.btn-primary:active{transform:translate(2px,2px);box-shadow:var(--shadow-press) var(--shadow-pink)}
.btn-primary.intro{animation:shine-once var(--dur-slow) var(--ease-in) 1}
@keyframes shine-once{from{opacity:.6;transform:translateY(var(--sp-1))}}
.btn-secondary{min-height:var(--tap);background:var(--surface-1);border:1px solid var(--neon-cyan);color:var(--neon-cyan)}
.btn-secondary:active{transform:translate(2px,2px)}
.btn-danger{background:var(--loss-strong);color:var(--ink);border:1px solid var(--loss);box-shadow:var(--shadow-offset) var(--shadow-red)}
.btn-danger:active{transform:translate(2px,2px);box-shadow:var(--shadow-press) var(--shadow-red)}
.btn-text{width:auto;min-height:var(--tap);padding:0 var(--sp-2);color:var(--ink-muted);font-weight:var(--fw-semibold)}
.btn-text:hover,.btn-text:focus-visible{text-decoration:underline;color:var(--ink)}
.btn.inline{width:auto;max-width:100%;flex-wrap:wrap}
.btnwrap.inline{max-width:100%}
.btn[disabled]{opacity:.4;box-shadow:none;pointer-events:none}
.why{display:block;margin-top:var(--sp-1);font-size:var(--fs-xs);color:var(--ink-muted)}
.btnwrap{display:block}
.btnwrap.inline{display:inline-block}

/* ===== Accueil ===== */
.logo{font:var(--fw-regular) var(--fs-logo)/1 var(--font-display);text-align:center;margin-top:var(--sp-8);letter-spacing:.04em;white-space:nowrap;
  color:var(--ink);-webkit-text-stroke:1px var(--chrome-hi);text-shadow:0 0 var(--glow-xs) var(--ink),0 0 var(--glow-sm) var(--halo-pink),0 0 var(--glow-lg) var(--halo-pink)}
.logo.flick{animation:flicker var(--dur-flicker) steps(1) 1}
@keyframes flicker{0%,40%,100%{opacity:1}20%,60%{opacity:.35}}
.tagline{display:block;text-align:center;font:var(--fw-regular) var(--fs-xl)/var(--lh-tight) var(--font-script);color:var(--neon-cyan);margin-top:var(--sp-2);transform:rotate(var(--tilt))}
.tagline.flat{transform:none}
.top-act{gap:var(--sp-2);margin-left:auto;flex:none}
.top .pill{white-space:normal;line-height:var(--lh-tight);padding-block:var(--sp-1)}
.choices{display:flex;flex-direction:column;gap:var(--sp-3);margin-top:var(--sp-6)}
.choice{display:flex;align-items:center;gap:var(--sp-3);min-height:var(--choice-h);padding:var(--sp-3) var(--sp-4);text-align:left;background:var(--surface-1);border:var(--border);box-shadow:var(--shadow-offset) var(--shadow-line)}
.choice:active{transform:translate(2px,2px);box-shadow:var(--shadow-press) var(--shadow-line)}
.choice.main{border-color:var(--neon-pink)}
.choice b{display:block;font-size:var(--fs-md);font-weight:var(--fw-bold)}
.choice span{color:var(--ink-muted);font-size:var(--fs-sm)}
.choice .ico{margin-left:auto;color:var(--ink-muted)}

/* ===== Libellés de section ===== */
.label{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-6) 0 var(--sp-3);font-size:var(--fs-xs);font-weight:var(--fw-bold);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--neon-pink)}
.label::after{content:"";flex:1;height:1px;background:var(--line)}
h3.sec{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-6) 0 var(--sp-3);font-size:var(--fs-xs);font-weight:var(--fw-bold);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--ink-muted)}
h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sh-body>h3.sec:first-child{margin-top:var(--sp-2)}

/* ===== Champs, profil ===== */
.prow{display:flex;gap:var(--sp-3);align-items:center;margin-bottom:var(--sp-3)}
.prow input{flex:1;min-width:0;min-height:var(--tap);padding:0 var(--sp-3);border:0;border-bottom:2px solid var(--neon-cyan);background:var(--surface-3);font-weight:var(--fw-semibold)}
.av{width:var(--av);height:var(--av);flex:none;border-radius:var(--round);display:grid;place-items:center;font-size:var(--fs-xl);background:var(--surface-3);border:2px solid var(--c,var(--line))}
.av.sm{width:var(--av-sm);height:var(--av-sm);font-size:var(--fs-lg)}
.av.lg{width:var(--av-lg);height:var(--av-lg);font-size:var(--fs-2xl);margin:0 auto var(--sp-3)}
.x{width:var(--tap);height:var(--tap);display:grid;place-items:center;color:var(--ink-muted)}
.seg{display:flex;gap:var(--sp-1);padding:var(--sp-1);background:var(--surface-3);border:var(--border)}
.seg button{flex:1;min-width:0;min-height:var(--tap);padding:var(--sp-1) var(--sp-1);font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--ink-muted);line-height:var(--lh-tight)}
.seg button.on{color:var(--on-neon);font-weight:var(--fw-bold);background:linear-gradient(90deg,var(--seg-a),var(--seg-b));clip-path:polygon(var(--slant) 0,100% 0,calc(100% - var(--slant)) 100%,0 100%)}
.seg button small{display:block;font-size:var(--fs-xs);font-weight:var(--fw-regular);opacity:.85}
.seg button[disabled]{opacity:.4}
details.rules{margin-top:var(--sp-6);border-top:var(--border);padding-top:var(--sp-2)}
details.rules summary{min-height:var(--tap);display:flex;align-items:center;gap:var(--sp-2);cursor:pointer;color:var(--neon-cyan);font-weight:var(--fw-semibold);list-style:none}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary::before{content:"+";width:var(--sp-4);font-weight:var(--fw-bold)}
details.rules[open] summary::before{content:"\2212"}
details.rules p{color:var(--ink-muted);font-size:var(--fs-sm)}

/* ===== Écran de passage / connexion ===== */
.pass{min-height:calc(100dvh - var(--pass-offset));display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:var(--sp-4)}
.pass h1{font-size:var(--fs-2xl)}
.pass .who-lbl{color:var(--ink-muted)}
.bigav{position:relative;width:var(--av-xl);height:var(--av-xl);font-size:var(--fs-3xl);border-radius:var(--round);display:grid;place-items:center;background:var(--surface-3);border:var(--ring-lg) solid var(--c);box-shadow:var(--halo) var(--c)}
.bigav::after{content:"";position:absolute;inset:calc(-1 * var(--ring-lg));border-radius:var(--round);border:var(--ring-lg) solid var(--c);animation:pulse var(--loop-pulse) var(--ease-in) infinite}
@keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(1.35);opacity:0}}
.pill{display:inline-flex;align-items:center;gap:var(--sp-2);min-height:var(--pill-h);padding:0 var(--sp-3);background:var(--surface-1);border:var(--border);font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--ink-muted)}
.pass .btnwrap{width:100%;max-width:var(--narrow)}

/* ===== Écran du tour ===== */
.top{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.top .row{gap:var(--sp-2)}
.hero{position:relative;padding:var(--sp-6) var(--sp-4) var(--sp-4);background:var(--surface-1);border:1px solid;border-image:linear-gradient(135deg,var(--c),var(--line) 60%) 1}
.hero::before,.sheet .panel2::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--stripes);
  background:linear-gradient(180deg,var(--stripe-1) 0 2px,transparent 2px 3px,var(--stripe-2) 3px 5px,transparent 5px 6px,var(--stripe-3) 6px 8px)}
.hero .who{display:flex;gap:var(--sp-3);align-items:center}
.hero .who b{font-size:var(--fs-lg)}
.hero .meta{color:var(--ink-muted);font-size:var(--fs-sm)}
.cash{font:var(--fw-regular) var(--fs-2xl)/1 var(--font-display);margin-top:var(--sp-4);color:var(--cash)}
.cash.lit{text-shadow:0 0 var(--glow-sm) var(--halo-cash)}
.cash.neg{color:var(--loss)}
.sub{display:flex;gap:var(--sp-1) var(--sp-4);margin-top:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--ink-muted)}
.sub b{color:var(--ink);font-weight:var(--fw-semibold)}
.heat{margin-top:var(--sp-4)}
.heat .lbl{display:flex;justify-content:space-between;font-size:var(--fs-xs);margin-bottom:var(--sp-1);color:var(--ink-muted)}
.heat .bar{height:var(--pip-h);background:var(--surface-3)}
.heat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-pink),var(--loss))}
.ap{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-3);padding:var(--sp-3) var(--sp-4);background:var(--surface-1);border:var(--border);font-size:var(--fs-sm);font-weight:var(--fw-semibold)}
.ap .pips{display:flex;gap:var(--sp-2)}
.ap .pips i{width:var(--pip-w);height:var(--pip-h);clip-path:polygon(var(--slant-sm) 0,100% 0,calc(100% - var(--slant-sm)) 100%,0 100%);background:var(--line)}
.ap .pips i.on{background:var(--neon-cyan)}
.opps{display:flex;flex-direction:column;gap:var(--sp-2)}
.opp{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-3);background:var(--surface-1);border:1px solid var(--cash)}
.opp .e{font-size:var(--fs-xl);line-height:1;width:var(--av-sm);text-align:center;flex:none}
.opp .bd{flex:1;min-width:0}
.opp b{display:block;font-size:var(--fs-md);font-weight:var(--fw-semibold)}
.opp p{margin:var(--sp-1) 0 var(--sp-3);font-size:var(--fs-sm);color:var(--ink-muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-3)}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-1);aspect-ratio:1/1;min-width:0;padding:var(--sp-6) var(--sp-2) var(--sp-3);
  background:var(--surface-1);border:1px solid var(--neon-cyan);box-shadow:var(--shadow-offset) var(--shadow-cyan);text-align:center}
.tile:active{transform:translate(2px,2px);box-shadow:var(--shadow-press) var(--shadow-cyan)}
.tile.dark{border-color:var(--neon-pink);box-shadow:var(--shadow-offset) var(--shadow-pink)}
.tile.dark:active{box-shadow:var(--shadow-press) var(--shadow-pink)}
.tile .c{position:absolute;top:0;right:0;min-height:var(--tag-h);padding:0 var(--sp-2);display:flex;align-items:center;background:var(--surface-3);font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--ink-muted)}
.tile .e{height:var(--tile-emoji-box);display:grid;place-items:center;font-size:var(--fs-emoji-tile);line-height:1}
.tile .n,.tile .s{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .n{font-size:var(--fs-sm);font-weight:var(--fw-semibold)}
.tile .s{font-size:var(--fs-xs);color:var(--ink-muted)}
.tile .ill{position:absolute;top:0;left:0;min-height:var(--tag-h);padding:0 var(--sp-2);display:flex;align-items:center;font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--neon-pink)}
.tile.used{opacity:.4;box-shadow:none}
.tile.live{border-color:var(--cash)}
.tile.live .c{color:var(--cash)}
.freebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-2)}
.free{min-height:var(--free-h);padding:var(--sp-2) var(--sp-1);background:var(--surface-1);border:var(--border);font-size:var(--fs-xs);font-weight:var(--fw-semibold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-1);text-align:center;line-height:var(--lh-tight)}
.free span{font-size:var(--fs-lg)}
.free.hot{border-color:var(--dirty)}
.free:active{transform:translate(2px,2px)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:var(--sp-3) var(--sp-4) calc(env(safe-area-inset-bottom) + var(--sp-3));background:var(--bg-scene);border-top:var(--border)}
.dock>*{max-width:var(--dock-w);margin:0 auto}
.dockrow{display:flex;gap:var(--sp-2);align-items:stretch}.dockrow>.btn{flex:1;min-width:0}
/* Interrupteur Manche / Actions : deux moitiés, la moitié active prend le dégradé néon des sélecteurs. */
.tswitch{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-1);width:var(--switch-w);min-height:var(--btn-h);padding:var(--sp-1);background:var(--surface-3);border:var(--border)}
.tswitch span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--ink-muted);transition:color var(--dur-fast)}
.tswitch span .i3d{width:var(--switch-ico);height:var(--switch-ico);transition:transform var(--dur-fast),filter var(--dur-fast)}
.tswitch span:not(.on) .i3d{filter:grayscale(.85) brightness(.7)}
.tswitch span.on{color:var(--ink);font-weight:var(--fw-bold);background:var(--surface-1);box-shadow:inset 0 0 0 1px var(--neon-pink),0 0 var(--glow-sm) var(--halo-pink)}
.tswitch span.on .i3d{transform:scale(1.08)}
.tswitch:active{transform:translate(1px,1px)}

/* ===== Feuilles ===== */
.sheet{position:fixed;inset:0;z-index:50;pointer-events:none;visibility:hidden;transition:visibility 0s linear var(--dur-base)}
.sheet .bg{position:absolute;inset:0;background:var(--bg-scrim);opacity:0;transition:opacity var(--dur-base) var(--ease-out)}
.sheet .panel2{position:absolute;left:0;right:0;bottom:var(--kb,0px);max-width:var(--sheet-w);margin:0 auto;max-height:min(var(--sheet-max),calc(var(--vvh,100dvh) - var(--sp-4)));display:flex;flex-direction:column;
  background:var(--surface-2);border-top:1px solid var(--line);transform:translateY(105%);transition:transform var(--dur-base) var(--ease-out)}
.sheet.open{pointer-events:auto;visibility:visible;transition:visibility 0s}
.sheet.open .bg{opacity:1;transition:opacity var(--dur-slow) var(--ease-in)}
.sheet.open .panel2{transform:translateY(var(--drag,0px));transition:transform var(--dur-slow) var(--ease-in)}
.sheet.dragging .panel2{transition:none}
.sh-head{flex:none;display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);min-height:var(--head-h);padding:var(--sp-3) var(--sp-4) 0;touch-action:none}
.sh-head h2{font-size:var(--fs-lg);min-width:0}
.sh-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:var(--sp-2) var(--sp-4) var(--sp-4)}
.sh-foot{flex:none;padding:var(--sp-3) var(--sp-4) calc(env(safe-area-inset-bottom) + var(--sp-3));background:var(--surface-2);border-top:var(--border)}
.sh-foot:empty{display:none}
.sh-body:has(+ .sh-foot:empty){padding-bottom:calc(env(safe-area-inset-bottom) + var(--sp-6))}
.grab{flex:none;width:var(--sp-8);height:var(--sp-1);background:var(--line);margin:var(--sp-3) auto 0;touch-action:none}

/* onglets horizontaux (actifs, jeux) */
.tabs{display:flex;gap:var(--sp-1);overflow-x:auto;padding-bottom:var(--sp-1);margin-bottom:var(--sp-3);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:var(--tap);padding:0 var(--sp-4);background:var(--surface-3);border:var(--border);font-size:var(--fs-sm);font-weight:var(--fw-semibold);white-space:nowrap;color:var(--ink-muted)}
.tabs button.on{color:var(--on-neon);font-weight:var(--fw-bold);border-color:transparent;background:linear-gradient(90deg,var(--seg-a),var(--seg-b));clip-path:polygon(var(--slant) 0,100% 0,calc(100% - var(--slant)) 100%,0 100%)}
.tabs button .tag{margin-left:var(--sp-1)}

/* ===== Lignes de liste ===== */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:var(--sp-3);width:100%;min-height:var(--row-h);padding:var(--sp-2) 0;border-bottom:var(--border);text-align:left;background:none}
.item .ic{flex:none;width:var(--av-sm);text-align:center;font-size:var(--fs-xl);line-height:1}
.item .bd{flex:1;min-width:0}
.item .bd>b{display:block;font-size:var(--fs-md);font-weight:var(--fw-semibold)}
.item .bd>.small{display:block}
.item .pro>span{display:block;color:var(--ink)}.item .pro>span.muted{color:var(--ink-muted)}
.item .rt{flex:none;text-align:right}
.item .rank{flex:none;width:var(--sp-6);font-weight:var(--fw-bold);color:var(--cash)}
.item.lock{opacity:.5}
.item.mine{border-left:var(--bar-w) solid var(--cash);padding-left:var(--sp-3)}
.item.pick{padding:var(--sp-3);margin-bottom:var(--sp-2);background:var(--surface-1);border:var(--border);box-shadow:var(--shadow-offset) var(--shadow-line)}
.item.pick:active{transform:translate(2px,2px);box-shadow:var(--shadow-press) var(--shadow-line)}
.item.pick.sel{border-color:var(--neon-cyan)}
.ill .item.pick.sel{border-color:var(--neon-pink)}
.item .btns{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-2)}
/* Deux choix côte à côte, sur une ligne : libellé en haut, coût en dessous. */
.item .btns.duo{display:grid;grid-template-columns:1fr 1fr}
.btns.duo .btn{width:100%;flex-direction:column;gap:0;padding:var(--sp-2);line-height:var(--lh-tight)}
.btns.duo .cost{font-size:var(--fs-xs)}

/* ===== Carte des États-Unis (immobilier) ===== */
.usmap{position:relative;aspect-ratio:4/3;margin-top:var(--sp-2);background:var(--map-sea);border:1px solid var(--map-edge);overflow:hidden}
.usmap>svg{position:absolute;inset:0;width:100%;height:100%}
.usmap .land{fill:var(--surface-1)}
.usmap .grid{fill:url(#mgrid)}
.usmap .coast{fill:none;stroke:var(--neon-cyan);stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 0 3px var(--halo-cyan))}
.usmap .gl{stroke:var(--neon-pink);stroke-width:.6;opacity:.28}
.mpin{position:absolute;width:var(--tap);height:var(--tap);margin:calc(var(--tap) / -2) 0 0 calc(var(--tap) / -2);background:none;border:0;color:var(--ink)}
.mpin i{position:absolute;left:50%;top:50%;width:var(--pin);height:var(--pin);margin:calc(var(--pin) / -2);transform:rotate(45deg);background:var(--neon-pink);box-shadow:0 0 var(--glow-sm) var(--halo-pink)}
.mpin.sel i{background:var(--cash);box-shadow:0 0 var(--glow-sm) var(--halo-cash);animation:pin-pulse 1.4s ease-in-out infinite}
@keyframes pin-pulse{50%{box-shadow:0 0 var(--glow-lg) var(--halo-cash)}}
.mpin .lb{position:absolute;white-space:nowrap;font-size:var(--fs-xs);font-weight:var(--fw-bold);letter-spacing:var(--ls-caps);text-transform:uppercase;line-height:var(--lh-tight);text-shadow:0 1px 2px var(--bg-scene),0 0 6px var(--bg-scene);text-align:left}
.mpin .lb small{display:block;font-size:var(--fs-xs);font-weight:var(--fw-semibold);letter-spacing:0;text-transform:none}
.mpin.sel .lb{color:var(--cash)}
.mpin.at-r .lb{left:calc(50% + var(--pin));top:50%;transform:translateY(-50%)}
.mpin.at-l .lb{right:calc(50% + var(--pin));top:50%;transform:translateY(-50%);text-align:right}
.mpin.at-t .lb{bottom:calc(50% + var(--pin));left:50%;transform:translateX(-50%);text-align:center}
.mpin.at-bl .lb{top:calc(50% + var(--pin));left:calc(var(--pin) * -1)}
.mpin.at-b .lb{top:calc(50% + var(--pin));left:50%;transform:translateX(-50%);text-align:center}
/* Fiche de la ville : posée sur la moitié de carte opposée à la ville, pour la laisser visible. */
.mcard{position:absolute;top:var(--sp-2);bottom:var(--sp-2);width:57%;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--neon-cyan);box-shadow:var(--shadow-offset) var(--shadow-line);animation:mcard-in var(--dur-base) var(--ease-in)}
.mcard.l{left:var(--sp-2)} .mcard.r{right:var(--sp-2)}
@keyframes mcard-in{from{opacity:0;transform:translateY(var(--sp-2))}}
.mcard .mh{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-1) var(--sp-1) 0 var(--sp-3)}
.mcard .mh h4{font:var(--fw-regular) var(--fs-md)/1.1 var(--font-display);color:var(--cash)}
.mcard .mb{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 var(--sp-3) var(--sp-2)}
.mcard .kv{padding:var(--sp-1) 0;font-size:var(--fs-xs)}
.mcard .spark{margin:var(--sp-1) 0}
.mcard .iconbtn{width:var(--chip-h);height:var(--chip-h)}
.mcard p{font-size:var(--fs-xs);color:var(--ink-muted);margin-top:var(--sp-2)}
.panel{padding:var(--sp-4);background:var(--surface-1);border:var(--border)}
.panel.tight{padding:var(--sp-3) var(--sp-4)}
.offer{margin-top:var(--sp-3)}
.offer .head{display:flex;gap:var(--sp-3);align-items:center;margin-bottom:var(--sp-2)}
.offer .head .e{font-size:var(--fs-2xl);line-height:1}
.offer .head b{display:block;font-size:var(--fs-md)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-3);padding:var(--sp-2) 0;border-bottom:var(--border);font-size:var(--fs-sm)}
.kv:last-child{border-bottom:0}
.kv>:last-child{text-align:right}
.kv.total{border-top:2px solid var(--ink-muted);border-bottom:0;margin-top:var(--sp-1);font-size:var(--fs-md);font-weight:var(--fw-bold)}
.tag{display:inline-flex;align-items:center;height:var(--tag-h);padding:0 var(--sp-2);font-size:var(--fs-xs);font-weight:var(--fw-semibold);border:var(--border);color:var(--ink-muted);white-space:nowrap;vertical-align:middle}
.tag.r{border-color:var(--loss);color:var(--loss)}
.tag.g{border-color:var(--gain);color:var(--gain)}
.tag.y{border-color:var(--cash);color:var(--cash)}
.tag.c{border-color:var(--neon-cyan);color:var(--neon-cyan)}
.tag.p{border-color:var(--neon-pink);color:var(--neon-pink)}
.tags{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-top:var(--sp-1)}

/* saisie de montant */
.amt{display:flex;flex-direction:column;gap:var(--sp-2)}
.amtrow{display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);background:var(--surface-3);border-bottom:2px solid var(--neon-cyan)}
.amtrow input{flex:1;min-width:0;min-height:var(--btn-h);border:0;background:none;font:var(--fw-regular) var(--fs-xl)/1 var(--font-display);color:var(--cash);outline:none}
.amtrow span{font-weight:var(--fw-bold);color:var(--ink-muted)}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.chip{min-width:var(--tap);height:var(--chip-h);padding:0 var(--sp-3);background:var(--surface-3);border:var(--border);font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--ink)}
.chip.gold{border-color:var(--cash);color:var(--cash)}
.chip.on{border-color:var(--neon-cyan);color:var(--neon-cyan)}

/* notes et encadrés : une seule forme */
.note,.err,.result{padding:var(--sp-3);background:var(--surface-3);border-left:var(--bar-w) solid var(--neon-cyan);font-size:var(--fs-sm);color:var(--ink-muted);max-width:none}
.note b,.err b{color:var(--ink)}
.note.warn{border-left-color:var(--neon-pink)}
.note.ro{border-left-color:var(--cash);margin-bottom:var(--sp-3)}
.err{border-left-color:var(--loss);color:var(--ink);margin-top:var(--sp-3)}
.result{margin:var(--sp-3) 0;font-size:var(--fs-md);font-weight:var(--fw-bold);color:var(--ink);border-left-color:var(--line)}
.result.w{border-left-color:var(--gain)} .result.l{border-left-color:var(--loss)}
.result .big{display:block;font-size:var(--fs-xl);font-variant-numeric:tabular-nums}

/* ===== Casino ===== */
.casino-head{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.casino-head .t{flex:1;min-width:0}
.casino-head .t b{display:block;font-size:var(--fs-lg)}
/* roue : objet de jeu, reste ronde */
.wheel{width:var(--wheel);height:var(--wheel);margin:var(--sp-2) auto var(--sp-4);border-radius:var(--round);display:grid;place-items:center;font:var(--fw-regular) var(--fs-3xl)/1 var(--font-display);font-variant-numeric:tabular-nums;
  background:var(--surface-3);border:var(--wheel-rim) solid var(--line);outline:2px solid var(--neon-pink);outline-offset:0}
.wheel.r{background:var(--roul-red)} .wheel.b{background:var(--roul-black)} .wheel.g{background:var(--roul-green)}
.betgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-1)}
.betgrid button{min-height:var(--btn-h);background:var(--surface-3);border:var(--border);font-size:var(--fs-sm);font-weight:var(--fw-semibold)}
.betgrid button small{display:block;color:var(--ink-muted);font-size:var(--fs-xs);font-weight:var(--fw-regular)}
.betgrid button.on{color:var(--on-neon);border-color:transparent;background:linear-gradient(90deg,var(--seg-a),var(--seg-b))}
.betgrid button.on small{color:var(--on-neon)}
.cards{display:flex;gap:var(--sp-2);flex-wrap:wrap;min-height:var(--card-h)}
.pc{width:var(--card-w);height:var(--card-h);background:var(--card-face);color:var(--card-black);display:flex;flex-direction:column;justify-content:space-between;padding:var(--sp-1) var(--sp-2);font-weight:var(--fw-bold);animation:deal var(--dur-slow) var(--ease-in)}
.pc.red{color:var(--card-red)}
.cards{perspective:600px}.pc.flipin{animation:pc-flip var(--dur-flip) var(--ease-in)}
@keyframes pc-flip{from{transform:rotateY(90deg)}}
.pc .big{font-size:var(--fs-xl);text-align:center;line-height:1}
.pc.back{background:repeating-linear-gradient(45deg,var(--card-back-a) 0 6px,var(--card-back-b) 6px 8px);border:var(--ring-lg) solid var(--card-face)}
@keyframes deal{from{transform:translateY(calc(-1 * var(--sp-4)));opacity:0}}
/* Machine à sous : meuble néon, trois rouleaux derrière une vitre, ligne de gain, écran à cristaux. */
.slot{position:relative;margin:var(--sp-2) 0 var(--sp-4);padding:var(--sp-3);background:linear-gradient(180deg,var(--surface-2),var(--bg-scene));border:1px solid var(--neon-pink);box-shadow:0 0 var(--glow-sm) var(--halo-pink),inset 0 0 var(--glow-lg) var(--slot-inner)}
.slot-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-3);font:var(--fw-regular) var(--fs-sm)/1 var(--font-display);color:var(--neon-cyan);text-transform:uppercase;letter-spacing:var(--ls-caps);text-shadow:0 0 var(--glow-xs) var(--halo-cyan)}
.slot-top b{display:flex;align-items:center;gap:2px;color:var(--cash);text-shadow:0 0 var(--glow-xs) var(--halo-cash)}
.slot-top .i3d{width:18px;height:18px}

  animation:card-in var(--dur-slow) var(--ease-in)}

@keyframes card-in{from{transform:translateY(var(--sp-4)) rotate(var(--tilt));opacity:0}}

<body>
<div id="splash" role="status" aria-label="Chargement du jeu"><div class="logo">SCARFACE</div><div class="lbar" aria-hidden="true"></div><p>Chargement</p></div>

/* ================= UTILS ================= */
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.random()*(b-a)+a, RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function fmt(n,sign){const s=n<0?'−':(sign&&n>0?'+':'');n=Math.abs(n);
  if(n>=1e9)return s+(n/1e9).toFixed(2).replace('.',',')+' Md€';
  if(n>=1e6)return s+(n/1e6).toFixed(2).replace('.',',')+' M€';
  return s+Math.round(n).toLocaleString('fr-FR')+' €'}
function fmtP(p){return p>=1000?Math.round(p).toLocaleString('fr-FR')+' €':p>=1?p.toFixed(2).replace('.',',')+' €':p.toFixed(4).replace('.',',')+' €'}
function pct(x){return (x>=0?'+':'−')+Math.abs(x*100).toFixed(1).replace('.',',')+' %'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function iconBtn(n,label,on){return `<button class="iconbtn" aria-label="${label}" onclick="${on}">${icon(n)}</button>`}
/* Coin haut droit de chaque écran (sauf l'accueil) : règles et réglages ; en partie, aussi classement et quitter. */
function topActs(game){return `<div class="row top-act">${game?iconBtn('trophy','Classement','openRanking()'):''}${iconBtn('book','Règles','openRules()')}${iconBtn('gear','Réglages','openSettings()')}${game?iconBtn('exit','Quitter la partie','openQuit()'):''}</div>`}
function topBar(left,game){return `<div class="top" data-z="top">${left||'<span></span>'}${topActs(game)}</div>`}
/* Bouton. v : primary | secondary | danger | text. cost : montant affiché à part. why : raison écrite sous un bouton désactivé. */
function B(label,o={}){const v=o.v||'secondary',dis=!!o.why;/* quiet : désactivé, sans phrase d'explication dessous */
  const b=`<button class="btn btn-${v}${o.inline?' inline':''}${o.intro?' intro':''}"${o.id?` id="${o.id}"`:''}${dis?' disabled':''} onclick="${o.on||''}">${label}${o.cost?` <span class="cost">${o.cost}</span>`:''}</button>`;
  return dis&&!o.quiet?`<span class="btnwrap${o.inline?' inline':''}">${b}<span class="why">${o.why}</span></span>`:b}
/* Raison commune d'indisponibilité : points d'action d'abord, puis cash. */
function whyNot(ap,cost,p){p=p||cur();if(ap&&G.ap<ap)return G.ap?`Il faut ${ap} PA, il t’en reste ${G.ap}`:'Plus de points d’action';if(cost>0&&p.cash<cost)return `Il te manque ${fmt(cost-p.cash)}`;return ''}
function note(html,k){return `<div class="note${k?' '+k:''}">${html}</div>`}
function waitDots(){return `<span class="waiting" aria-hidden="true"><i></i><i></i><i></i></span>`}
const EMO_LEAD=/^(?:\p{Extended_Pictographic}|\p{Emoji_Presentation}|[‍️\s])+/u;
function noEmo(s){return String(s).replace(EMO_LEAD,'')}
/* Section de libellé (capitales espacées) */
function label(t){return `<div class="label">${t}</div>`}

const EMO_KEEP="↗↘★♠♣♥♦";
/* Tuile 3D : tranche décalée, face en dégradé de la famille, reflet sur la moitié haute, arête lumineuse,
   puis le pictogramme avec son ombre portée, son calque d'accent coloré et son tracé clair. */
const ICO_PALS=['pink','cyan','gold','green','red','violet','sun'];
const ICO_FACE='10,2 56,2 60,6 60,52 54,58 8,58 4,54 4,8',ICO_GLOSS='10,2 56,2 60,6 60,27 4,27 4,8';
const icoMemo={};
function icoGlyph(name,pal,bare){const [duo,main]=ICO[name];
  return `<g transform="translate(14,18)" style="fill:var(--ico-shadow)">${main}</g><g style="fill:var(--ico-${pal}-acc)">${duo}</g><g style="fill:${bare?`url(#ig-${pal})`:'var(--ico-glyph)'}">${main}</g>`}
function icon3d(name,pal,mode){const k=name+pal+mode;if(icoMemo[k])return icoMemo[k];
  const s=mode==='bare'
    ?`<svg class="i3d" viewBox="-8 -8 280 280" aria-hidden="true" focusable="false">${icoGlyph(name,pal,1)}</svg>`
    :`<svg class="i3d" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><polygon points="${ICO_FACE}" transform="translate(2,4)" style="fill:var(--ico-${pal}-edge)"/><polygon points="${ICO_FACE}" style="fill:url(#ig-${pal})"/><polygon points="${ICO_GLOSS}" style="fill:url(#ig-gloss)"/><polyline points="4,30 4,8 10,2 56,2" fill="none" stroke-width="1.2" style="stroke:var(--ico-hi)"/><g transform="translate(13,11) scale(.15)">${icoGlyph(name,pal,0)}</g></svg>`;
  return icoMemo[k]=s}
/* Icône d'un emoji du jeu (les données gardent l'emoji comme clé, l'affichage montre l'icône). */
function emoKey(e){return EMO[e]?e:EMO[e+'️']?e+'️':EMO[e.replace(/️/g,'')]?e.replace(/️/g,''):null}
function emoIcon(e,mode){const k=emoKey(e);return k?icon3d(EMO[k][0],EMO[k][1],mode||'tile'):''}
/* Version positionnée dans un SVG (courbe de fin de partie). */
function emoAt(e,x,y,size){const k=emoKey(e);if(!k)return '';const [n,pal]=EMO[k];
  return `<svg x="${x}" y="${y}" width="${size}" height="${size}" viewBox="-8 -8 280 280">${icoGlyph(n,pal,1)}</svg>`}
const EMO_RE=/[0-9#*]️?⃣|\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic}️?)*/gu;
/* Conteneurs dont l'emoji est tout le contenu : on y met une tuile ; avatars : pictogramme seul ; ailleurs : petite icône en ligne. */
const ICO_TILE='.ic,.e,.ev-e,.reel,.free>span,.fi>.a,.offer .head .e';
function stripEmo(s){return String(s).replace(EMO_RE,m=>EMO_KEEP.includes(m.replace(/️/g,''))?m:'').replace(/\s{2,}/g,' ').trim()}
function iconize(root){if(!root||root.nodeType===8)return;
  if(root.nodeType===3){const p=root.parentNode;if(p)iconizeText(root);return}
  if(root.closest&&root.closest('svg,#toast'))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];let n;
  while(n=w.nextNode()){EMO_RE.lastIndex=0;if(EMO_RE.test(n.nodeValue))list.push(n)}
  list.forEach(iconizeText)}
function iconizeText(t){const par=t.parentNode;if(!par||!par.closest||par.closest('svg,#toast,script,style,textarea,.pk'))return;
  const txt=t.nodeValue;EMO_RE.lastIndex=0;if(!EMO_RE.test(txt))return;
  const mode=par.closest('.av,.bigav')?'bare':(par.matches(ICO_TILE)&&txt.replace(EMO_RE,'').trim()==='')?'tile':'bare';
  /* Rien à remplacer (seulement des symboles conservés comme ♠ ★ ↗) : on ne touche pas au DOM, sinon le
     MutationObserver ré-analyse le même texte à l'infini et la page se fige. */
  EMO_RE.lastIndex=0;let any=false,m;while((m=EMO_RE.exec(txt))){if(!EMO_KEEP.includes(m[0].replace(/️/g,''))){any=true;break}}
  if(!any)return;
  const f=document.createDocumentFragment();let last=0;EMO_RE.lastIndex=0;
  while((m=EMO_RE.exec(txt))){const e=m[0];if(EMO_KEEP.includes(e.replace(/️/g,'')))continue;
    if(m.index>last)f.appendChild(document.createTextNode(txt.slice(last,m.index)));
    const svg=emoIcon(e,mode);if(svg){const s=document.createElement('span');s.className='i3w '+(mode==='tile'?'i3-tl':'i3-in');s.innerHTML=svg;f.appendChild(s)}
    last=m.index+e.length}
  if(last<txt.length)f.appendChild(document.createTextNode(txt.slice(last)));
  par.replaceChild(f,t)}

(()=>{const d=document.createElement('div');d.setAttribute('aria-hidden','true');d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
  d.innerHTML=`<svg width="0" height="0"><defs>${ICO_PALS.map(p=>`<linearGradient id="ig-${p}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ico-${p}-a)"/><stop offset="1" style="stop-color:var(--ico-${p}-b)"/></linearGradient>`).join('')}
  <linearGradient id="ig-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ico-hi)"/><stop offset="1" style="stop-color:var(--ico-hi);stop-opacity:0"/></linearGradient></defs></svg>`;

/* Tout ce qui entre dans la page passe par iconize : écrans, feuilles, cartes, rouleaux, dés. */
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1||n.nodeType===3)iconize(n)}).observe(document.body,{childList:true,subtree:true});

/* Anti double-tap : après un clic, l'écran se redessine souvent ; un second tap rapide tombait alors sur le bouton
   apparu au même endroit (revendre la boîte suivante, relancer une partie de casino, passer deux tours…). */
let tapT=0,tapSeen=new WeakSet();
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;const now=performance.now();
  if(now-tapT<350&&!tapSeen.has(b)){e.stopImmediatePropagation();e.preventDefault();return}
  tapT=now;tapSeen=new WeakSet(document.querySelectorAll('button'))},true);

function tone(f,d=.1,type='sine',v=.07,delay=0){if(!SOUND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}

/* Vibrations : un petit vocabulaire cohérent, réservé aux moments qui comptent.
   Android : motifs rythmés (API Vibration). iPhone : Safari ne sait pas vibrer ; depuis iOS 18, basculer un
   interrupteur natif produit un tic haptique, utilisé en repli (un tic, ou deux pour les grands moments). */
const HAPTIC={action:[12],confirm:[18,40,18],start:[25,60,25,60,70],turn:[40,70,40,70,120],round:[30,50,60],
  win:[20,40,40],jackpot:[30,40,30,40,30,40,120],lose:[70],error:[45,30,45],arrest:[200,100,200,100,400],unlock:[20,40,20,40,80],step:[25]};
let HAPTICS=true;try{HAPTICS=localStorage.getItem('sf_haptics')!=='0'}catch(e){}
const iosTick=(()=>{if('vibrate' in navigator)return null;try{const l=document.createElement('label'),i=document.createElement('input');
  i.type='checkbox';i.setAttribute('switch','');i.tabIndex=-1;l.className='sr';l.setAttribute('aria-hidden','true');l.appendChild(i);document.body.appendChild(l);
  return ()=>{try{l.click()}catch(e){}}}catch(e){return null}})();
const canHaptic=('vibrate' in navigator)||!!iosTick;
function haptic(name){if(!HAPTICS)return;const p=HAPTIC[name]||HAPTIC.action;
  try{if(navigator.vibrate){navigator.vibrate(p);return}if(iosTick){iosTick();if(p.length>3)setTimeout(iosTick,p[0]+p[1])}}catch(e){}}
function buzz(){haptic('action')}
/* Toasts : une seule file, deux visibles au plus, pas de doublon consécutif, jamais d'emoji en tête. */
let toastLast='';
function toast(m,bad){m=stripEmo(m);const tw=$('#toast');if(m===toastLast&&tw.children.length)return;toastLast=m;
  while(tw.children.length>=2)tw.firstChild.remove();
  const d=document.createElement('div');d.className='t'+(bad?' bad':'');d.textContent=m;tw.appendChild(d);if(bad)haptic('error');
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>{d.remove();if(!tw.children.length)toastLast=''},150)},2600)}
function popMoney(n){const d=document.createElement('div');d.className='pop '+(n>=0?'up':'down');d.textContent=fmt(n,true);document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function niceRound(x){if(x<=0)return 0;const m=Math.pow(10,Math.floor(Math.log10(x))-1);return Math.round(x/m)*m}

function oppUnit(p){return niceRound(clamp(avgWorth()*.12,2000,3e6))}
/* Le premier du classement, ou celui qui vient de toucher un jackpot : la cible de la manche. */
function leader(){return G.players.length>1?ranked()[0]:null}
function isMark(t){return !!t&&(t===leader()||(t.mark||0)>=G.round)}
function genOpps(p){const u=oppUnit(p),pool=OPPS.filter(o=>!o.need||o.need(p)),out=[];
  const mk=d=>{const r=d.roll?d.roll(p):{};if(r===null)return null;const o={id:rid(5),k:d.k,u,...r};o.cost=niceRound(d.c(u,o));if(d.gain)o.gain=niceRound(d.gain(u));return o};
  /* Le dernier du classement a une chance sur deux de se voir proposer le coup du siècle. */
  if(G.players.length>1&&ranked().at(-1)===p&&Math.random()<.5){const o=mk(oppDef('century'));if(o)out.push(o)}
  /* 2 % : une opportunité légendaire, la même taille pour tout le monde. */
  if(Math.random()<.02){const o=mk(oppDef('legend'));if(o)out.push(o)}
  while(out.length<3&&pool.length){const d=pool.splice(Math.floor(Math.random()*pool.length),1)[0];const o=mk(d);if(o)out.push(o)}
  return out}

const bizVal=b=>{const d=bizDef(b.k);return Math.max(d.cost*.3,d.cost*.5+3*(d.min+d.max)/2*bizMult(b.lvl))};
function stockVal(p){let v=0;for(const s in p.stocks)v+=p.stocks[s]*asset(s).price;return v}
function myProps(p){return p.re||[]}
function propsVal(p){return myProps(p).reduce((a,x)=>a+rprice(x.c,x.t),0)}

/* L'argent sale ne compte que pour moitié tant qu'il n'est pas blanchi. */
const DIRTY_VALUE=.5;
function netWorth(p){return (G&&G.auction?myBid(p):0)+p.cash+(p.dirty||0)*DIRTY_VALUE+posTotal(p)+stockVal(p)+propsVal(p)+bizTotal(p)+dealsVal(p)-p.debt-(p.shark?p.shark.amt:0)}

function bigWin(p,amount,txt){p.mark=G.round+1;p.heat=clamp(p.heat+10,0,100);shared({t:'hl',item:{r:G.round,pid:p.id,t:txt,v:amount}});

/* Argent « saisissable » : cash + Bourse. Garder zéro cash ne protège plus des amendes, impôts et arnaques. */
function liquid(p){return Math.max(0,p.cash)+stockVal(p)}
/* Prend x : d'abord le cash, puis vend des actions au prorata. Renvoie ce qui a été pris. */
function takeLiquid(p,x){x=Math.min(Math.max(0,x),liquid(p));let left=x;const c=Math.min(Math.max(0,p.cash),left);p.cash-=c;left-=c;
  const sv=stockVal(p);if(left>0&&sv>0){const f=Math.min(1,left/sv);for(const s in p.stocks){p.stocks[s]*=(1-f);if(p.cost&&p.cost[s])p.cost[s]*=(1-f);if(p.stocks[s]*asset(s).price<1){delete p.stocks[s];if(p.cost)delete p.cost[s]}}left=0}
  return x}

/* ================= RENDER ROUTER ================= */
/* Rendu par zones : chaque écran est une suite de blocs data-z. Si l'écran est le même, seuls les blocs dont
   le contenu a changé sont remplacés ; le défilement, le focus et la saisie en cours sont conservés. */
/* On compare le HTML source de chaque zone (gardé dans __src) et non son outerHTML : les emojis y sont remplacés
   par des icônes SVG, donc l'outerHTML différait toujours et chaque rendu recréait tous les boutons (clics perdus). */
function paint(html,key){const app=$('#app');
  const t=document.createElement('template');t.innerHTML=html;
  const nz=[...t.content.children],src=nz.map(n=>n.outerHTML),oz=[...app.children];
  const full=()=>{app.innerHTML=html;[...app.children].forEach((c,i)=>c.__src=src[i])};
  if(app.dataset.key!==key){full();app.dataset.key=key;return}
  if(nz.length!==oz.length||nz.some((n,i)=>(n.dataset.z||'')!==(oz[i].dataset.z||''))){full();return}
  nz.forEach((n,i)=>{if(src[i]!==oz[i].__src){oz[i].replaceWith(n);n.__src=src[i]}})}

    c.on('message',(t,pl)=>{const code=t.split('/').pop(),str=pl.toString();if(!/^[A-Z0-9]{4}$/.test(code))return;
      if(!str){if(APP.pubs[code]&&APP.pubs[code].broker===u)delete APP.pubs[code];refreshPubs();return}

/* ================= ONLINE (MQTT) ================= */
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://test.mosquitto.org:8081/mqtt'];
(()=>{const b=new URLSearchParams(location.search).get('broker');if(b)BROKERS.splice(0,BROKERS.length,b)})();
const NS='scarface-jeu-fric-v2';
const CODECH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const rid=n=>Array.from({length:n},()=>CODECH[Math.floor(Math.random()*CODECH.length)]).join('');
/* Empreinte du code du jeu : deux téléphones qui n'ont pas la même version ne peuvent pas jouer ensemble
   (les messages ne se comprennent plus et la partie se bloque). Cas typique : le jeu a été mis à jour en ligne et
   un téléphone n'a pas rechargé la page. */
const APP_VER=(()=>{try{let t=document.currentScript?document.currentScript.textContent:'';const i=t.indexOf('\nrender();\n');if(i>0)t=t.slice(0,i);
  let h=0;for(let k=0;k<t.length;k++)h=(h*31+t.charCodeAt(k))|0;return (h>>>0).toString(36)}catch(e){return ''}})();
function verWarn(show){let w=document.getElementById('verWarn');
  if(!show){if(w)w.remove();return}if(w)return;w=document.createElement('div');w.id='verWarn';w.setAttribute('role','alert');
  w.innerHTML=`<span><b>Version différente de l’hôte.</b> Recharge la page pour jouer ensemble.</span><button class="btn btn-primary inline" onclick="location.reload()">Recharger</button>`;document.body.appendChild(w)}
const UID=(()=>{try{let u=localStorage.getItem('rq_uid');if(!u){u=rid(12);localStorage.setItem('rq_uid',u)}return u}catch(e){return rid(12)}})();
let ON=null,connAbort=false,pingTimer=null;
const tp=s=>`${NS}/${ON.code}/${s}`;
function pub(s,obj,retain,qos=1){if(!ON||!ON.client)return;try{ON.client.publish(tp(s),obj===''?'':JSON.stringify(obj),{qos,retain:!!retain})}catch(e){}}
function pubState(){pub('state',{from:UID,G},true)}
function pubLobby(){ON.lobby.ts=Date.now();ON.lobby.ver=APP_VER;pub('lobby',ON.lobby,true);pubPublic()}
/* Parties publiques : l'hôte affiche son salon sur un tableau commun (${NS}/public/CODE, message gardé par le relais).
   Retiré dès que la partie démarre, que le salon redevient privé, est plein ou fermé. Rafraîchi toutes les 20 s :
   une annonce plus vieille que 90 s est ignorée (hôte parti sans prévenir). */
const PUB_TTL=90000;
function pubPublic(force){if(!ON||!ON.host||!ON.lobby||!ON.client)return;const L=ON.lobby,on=!!(L.settings&&L.settings.pub&&!L.started&&!L.closed&&L.players.length<6);
  if(!on&&!ON.listed&&!force)return;ON.listed=on;ON.pubTs=Date.now();const h=L.players.find(q=>q.uid===L.host)||L.players[0]||{};
  try{ON.client.publish(`${NS}/public/${L.code}`,on?JSON.stringify({host:h.name,av:h.av,n:L.players.length,cash:L.settings.cash,rounds:L.settings.rounds,ts:Date.now()}):'',{qos:1,retain:true})}catch(e){}}
function isOnline(uid){if(uid===UID)return true;if(!ON||!uid)return false;if(!ON.presence[uid])ON.presence[uid]=Date.now();return Date.now()-ON.presence[uid]<14000}
/* Un relais qui refuse la connexion échoue tout de suite (avant : on attendait le délai complet pour rien). */
function connectBroker(url,ms){return new Promise((res,rej)=>{
  if(!window.mqtt)return rej(new Error('lib'));
  let c,done=false;
  const fail=e=>{if(done)return;done=true;clearTimeout(to);try{c&&c.end(true)}catch(_){}rej(e)};
  const to=setTimeout(()=>fail(new Error('timeout')),ms);
  try{c=mqtt.connect(url,{clientId:'rq_'+UID+'_'+rid(4),clean:true,connectTimeout:ms,reconnectPeriod:2000,keepalive:30})}catch(e){return fail(e)}
  c.once('connect',()=>{if(done)return;done=true;clearTimeout(to);res(c)});
  c.on('error',()=>{if(!c.connected)fail(new Error('error'))});c.on('close',()=>{if(!c.connected)fail(new Error('close'))});})}
/* Hôte : tous les relais sont essayés en même temps. On garde le plus prioritaire qui répond
   (on lui laisse 1,5 s d'avance sur les autres), et on ferme les autres. */
function firstBroker(list,ms){return new Promise(res=>{const st=list.map(()=>null);let done=false,grace=0;
  const finish=()=>{if(done)return;done=true;clearTimeout(grace);const i=st.findIndex(x=>x&&x.c);
    st.forEach((x,j)=>{if(x&&x.c&&j!==i)try{x.c.end(true)}catch(e){}});res(i<0?null:{client:st[i].c,broker:list[i]})};
  const check=()=>{if(done)return;if(connAbort)return finish();const i=st.findIndex(x=>x&&x.c);
    if(i<0){if(st.every(x=>x))finish();return}
    if(st.slice(0,i).every(x=>x))return finish();
    if(!grace)grace=setTimeout(finish,1500)};
  list.forEach((u,i)=>connectBroker(u,ms).then(c=>{if(done){try{c.end(true)}catch(e){}return}st[i]={c};check()},()=>{st[i]={};check()}))})}
/* Invité : on cherche le salon sur tous les relais à la fois, et on garde celui où l'hôte l'a ouvert.
   Avant, les relais étaient testés un par un avec des délais différents de ceux de l'hôte : si le premier relais
   était lent, l'hôte s'y connectait mais pas l'invité, qui finissait sur « Aucun salon avec ce code ». */
function findRoom(list,code,ms){return new Promise(res=>{const probes=[];let done=false,left=list.length;
  const end=w=>{if(done)return;done=true;clearTimeout(cap);clearInterval(ab);
    probes.forEach(p=>{if(p!==w)try{p.c.end(true)}catch(e){}});res(w?{client:w.c,broker:w.u,buf:w.buf,h:w.h}:null)};
  const closedOne=()=>probes.find(p=>p.closed)||null;
  const cap=setTimeout(()=>end(closedOne()),ms+4000),ab=setInterval(()=>{if(connAbort)end(null)},150);
  const idle=()=>{if(!done&&left===0&&probes.every(p=>performance.now()-p.t>3500))end(closedOne())};
  list.forEach(u=>connectBroker(u,ms).then(c=>{if(done){try{c.end(true)}catch(e){}return}
      const p={c,u,buf:[],t:performance.now(),closed:false};probes.push(p);
      p.h=(t,pl)=>{p.buf.push([t,pl]);if(done||!t.endsWith('/lobby'))return;const str=pl.toString();if(!str)return;
        let L;try{L=JSON.parse(str)}catch(e){return}if(L.closed){p.closed=true;return}end(p)};
      c.on('message',p.h);c.subscribe(`${NS}/${code}/#`,{qos:1});setTimeout(idle,3600)},()=>{})
    .finally(()=>{left--;idle()}))})}
function newON(client,broker,code,subscribed){
  ON={client,broker,code,host:false,lobby:null,presence:{},pending:null,wasIn:false,lastSeq:-1};
  client.on('message',onMessage);
  client.on('connect',()=>{if(ON&&ON.client===client){resync();render()}});
  if(!subscribed)client.subscribe(`${NS}/${code}/#`,{qos:1});
  return ON}
/* Après une coupure (téléphone en veille, réseau mobile), on republie ce qu'on est le seul à connaître :
   le salon pour l'hôte, et l'état de la partie si c'est nous qui l'avons modifié en dernier. Sans ça, une fin de
   tour envoyée pendant la coupure était perdue et la partie restait bloquée sur « … est en train de jouer ». */
function resync(){if(!ON)return;if(simFree()&&!ON.host)pubMe();if(ON.host&&ON.lobby&&!ON.lobby.closed)pubLobby();if(G&&ON.lastSeq===G.seq)pubState()}
function persistSession(){try{localStorage.setItem('sf_online',JSON.stringify({code:ON.code,broker:ON.broker}))}catch(e){}}
function abortConnect(){connAbort=true;if(ON&&ON.lobby){leaveOnline(false)}else{APP.view='home';render()}}
function startPing(){clearInterval(pingTimer);const f=()=>{if(ON)pub('ping',{uid:UID},false,0);if(ON&&ON.host&&ON.listed&&Date.now()-ON.pubTs>20000)pubPublic()};f();pingTimer=setInterval(()=>{f();if(!G&&APP.view==='lobby')renderLobby();else if(G&&ON&&G.screen==='free'&&!isMyTurn())render();else if(G&&ON&&!isMyTurn()&&(G.screen==='pass'||G.screen==='turn'))renderSpectate();else if(G&&ON&&G.screen==='recap')renderRecap()},4000)}

async function createRoom(){
  stopScan();saveProfile();if(!profile.name){APP.err='Choisis d’abord un pseudo.';renderHome();return}
  connAbort=false;APP.err='';APP.view='connecting';APP.connMsg='Ouverture du salon…';render();
  const r=await firstBroker(BROKERS,8000),client=r&&r.client,broker=r&&r.broker;
  if(connAbort){client&&client.end(true);return}
  if(!client){APP.view='home';APP.err='Impossible de joindre le serveur de jeu. Vérifie ta connexion internet et réessaie.';render();return}
  const code=rid(4);newON(client,broker,code);ON.host=true;
  ON.lobby={host:UID,ver:APP_VER,code,settings:{cash:10000,rounds:12,pub:false},players:[{uid:UID,name:profile.name,av:profile.av}],started:false,gameId:null};
  ON.wasIn=true;pubLobby();persistSession();startPing();APP.view='lobby';sfx.coin();render();
}
async function joinRoom(code){
  saveProfile();code=(code||'').toUpperCase().trim();
  if(!profile.name){APP.err='Choisis d’abord un pseudo.';APP.view='home';render();return}
  if(code.length!==4){APP.err='Le code fait 4 caractères.';APP.view='join';render();return}
  stopScan();connAbort=false;APP.err='';APP.view='connecting';APP.connMsg='Recherche du salon '+code+'…';render();
  const ses=getSession(),pref=ses&&ses.code===code&&ses.broker?ses.broker:APP.hint&&BROKERS.includes(APP.hint)?APP.hint:null;APP.hint=null;
  const order=pref?[pref,...BROKERS.filter(b=>b!==pref)]:BROKERS;
  /* L’invité attend plus longtemps que l’hôte (8 s) : il doit pouvoir atteindre le relais, même lent, où le salon a été ouvert. */
  const found=await findRoom(order,code,12000);
  if(connAbort){if(found)try{found.client.end(true)}catch(e){}return}
  if(found){found.client.removeListener('message',found.h);newON(found.client,found.broker,code,true);
    found.buf.forEach(([t,pl])=>{if(ON)onMessage(t,pl)})}
  if(!ON||!ON.lobby){if(ON){try{ON.client.end(true)}catch(e){}ON=null}APP.view='join';APP.err=`Aucun salon avec le code ${code}. Vérifie le code (ou la connexion).`;render();return}
  const L=ON.lobby;
  if(L.closed){failJoin('Ce salon a été fermé par l’hôte.');return}
  const inIt=L.players.some(p=>p.uid===UID);
  if(L.started&&!inIt){failJoin('La partie a déjà commencé sans toi.');return}
  ON.host=L.host===UID;ON.wasIn=inIt;persistSession();startPing();
  if(!inIt){sendJoin()}
  if(!G){APP.view='lobby'}
  sfx.coin();render();
}
function failJoin(msg){try{ON.client.end(true)}catch(e){}ON=null;G=null;try{localStorage.removeItem('sf_online')}catch(e){}APP.view='join';APP.err=msg;render()}
async function sendJoin(){for(let i=0;i<10;i++){if(!ON||!ON.lobby||ON.lobby.players.some(p=>p.uid===UID))return;pub('join',{uid:UID,name:profile.name,av:profile.av,ver:APP_VER});await sleep(1500)}}
function leaveOnline(forget){verWarn(false);
  if(ON){if(ON.host&&ON.listed){ON.lobby.closed=true;pubPublic(1)}
    if(ON.lobby&&!ON.lobby.started&&forget){if(ON.host){pub('lobby',{closed:true,host:UID},true);pub('state','',true)}else pub('leave',{uid:UID})}
    const c=ON.client;setTimeout(()=>{try{c.end(true)}catch(e){}},400)}
  ON=null;G=null;clearInterval(pingTimer);busy=false;forceClose();closeOv();
  if(forget){try{localStorage.removeItem('sf_online')}catch(e){}}
  APP.view='home';document.title='Scarface — The world is yours';render()}

function onMessage(topic,payload){
  if(!ON)return;const s=topic.split('/').pop();const str=payload.toString();if(!str)return;
  let m;try{m=JSON.parse(str)}catch(e){return}
  if(s==='ping'){if(m.uid)ON.presence[m.uid]=Date.now();return}
  if(s==='lobby')return onLobby(m);
  if(s==='state')return onState(m);
  if(s==='join')return onJoin(m);
  if(s==='leave')return onLeave(m);
  if(s==='msg'){if(m.type==='me')return onMe(m);return onMsg(m)}
}
function onLobby(L){
  if(ON.host&&ON.lobby&&L.host===UID&&!L.closed)return;
  if(L.closed){if(ON.lobby){toast('Le salon a été fermé par l’hôte.',1);leaveOnline(true)}else ON.lobby=L;return}

  const cards=[];

/* ================= SHEET ================= */
/* iPhone : Safari ignore overflow:hidden sur le body. Quand le clavier s'ouvrait dans une feuille, il faisait défiler
   la page derrière, et ce décalage restait après la fermeture du clavier : les boutons ne répondaient plus là où on
   les voyait, et il fallait recharger. On fige donc la page pendant qu'une feuille est ouverte, on remonte la feuille
   au-dessus du clavier, et on remet la page en place quand le clavier se ferme. */
let lockY=0;
function lockPage(){const b=document.body;if(b.classList.contains('locked'))return;lockY=window.scrollY||0;b.style.setProperty('--lock-y',(-lockY)+'px');b.classList.add('locked')}
function unlockPage(){const b=document.body;if(!b.classList.contains('locked'))return;b.classList.remove('locked');b.style.removeProperty('--lock-y');window.scrollTo(0,lockY)}
(()=>{const vv=window.visualViewport;if(!vv)return;const r=document.documentElement;
  const upd=()=>{r.style.setProperty('--kb',Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop))+'px');r.style.setProperty('--vvh',Math.round(vv.height)+'px')};
  vv.addEventListener('resize',upd);vv.addEventListener('scroll',upd);upd()})();
document.addEventListener('focusout',e=>{if(!e.target||!e.target.matches||!e.target.matches('input'))return;
  setTimeout(()=>{const a=document.activeElement;if(a&&a.matches&&a.matches('input'))return;if(document.body.classList.contains('locked'))window.scrollTo(0,0)},80)});
/* Feuille : en-tête fixe, corps qui défile, pied fixe. Un élément .sheet-foot rendu dans le corps est déplacé dans le pied. */
let sheetOpener=null;
function moveFoot(){const f=$('#shFoot'),s=$('#shBody .sheet-foot');f.innerHTML='';if(s)f.appendChild(s)}
function openSheet(title,html,fn){const sh=$('#sheet'),was=sh.classList.contains('open');
  $('#shTitle').textContent=noEmo(title);setBody(html);sheetFn=fn||null;
  if(!was){sheetOpener=document.activeElement;sh.classList.add('open');sh.setAttribute('aria-hidden','false');$('#shBody').scrollTop=0;
    lockPage();document.body.classList.add('paused');setTimeout(()=>{try{$('#shClose').focus({preventScroll:true})}catch(e){}},60)}
  showActiveTabs()}
/* Garde la position des listes horizontales quand la feuille se redessine ; à l'ouverture, montre l'onglet actif. */
function showActiveTabs(){document.querySelectorAll('#shBody .tabs').forEach(t=>{const on=t.querySelector('.on');if(on&&(on.offsetLeft<t.scrollLeft||on.offsetLeft+on.offsetWidth>t.scrollLeft+t.clientWidth))t.scrollLeft=on.offsetLeft-12})}
/* Corps de feuille : rien n'est recréé si le HTML est identique (un spectateur reçoit un état à chaque action
   du joueur actif : sans ça, ses boutons étaient remplacés sous son doigt). */
function setBody(html){const b=$('#shBody');if(b.__src===html&&b.__first===b.firstElementChild)return;b.innerHTML=html;b.__src=html;b.__first=b.firstElementChild}
function refreshSheet(){if(sheetFn&&$('#sheet').classList.contains('open')){const b=$('#shBody'),st=b.scrollTop,tl=[...b.querySelectorAll('.tabs')].map(t=>t.scrollLeft);
  const ae=document.activeElement,aid=ae&&$('#sheet').contains(ae)?ae.id:'';
  /* Les montants tapés par le joueur survivent au changement d'onglet, de levier, de mise… */
  const typed=[...document.querySelectorAll('#sheet input[data-u]')].map(e=>[e.id,e.value]);
  sheetFn();
  typed.forEach(([id,v])=>{const e=id&&document.getElementById(id);if(e&&!e.dataset.u){e.value=v;e.dataset.u='1'}});b.scrollTop=st;b.querySelectorAll('.tabs').forEach((t,i)=>{if(tl[i]!=null)t.scrollLeft=tl[i]});
  if(aid){const n=document.getElementById(aid);n&&n.focus({preventScroll:true})}}}
function closeSheet(){if(busy)return;forceClose()}
function forceClose(){const sh=$('#sheet');sheetFn=null;if(!sh.classList.contains('open'))return;
  sh.classList.remove('open','dragging');sh.setAttribute('aria-hidden','true');sh.style.removeProperty('--drag');
  unlockPage();if(!$('#ovWrap').children.length)document.body.classList.remove('paused');
  if(sheetOpener&&document.contains(sheetOpener)){try{sheetOpener.focus({preventScroll:true})}catch(e){}}sheetOpener=null}
function after(){document.querySelectorAll('#sheet input[data-u]').forEach(e=>delete e.dataset.u);save();render();refreshSheet()}
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('#sheet input'))e.target.dataset.u='1'});
/* Le pied suit le contenu : à chaque remplacement du corps, on y déplace le nouveau .sheet-foot (ou on le vide). */
new MutationObserver(ms=>{if(ms.some(m=>[...m.addedNodes].some(n=>n.nodeType===1)))moveFoot()}).observe($('#shBody'),{childList:true});
$('#shClose').innerHTML=icon('close');
/* Glisser vers le bas pour fermer : seuil de 80 px ou geste rapide, sinon retour élastique. */
(()=>{const sh=$('#sheet');let y0=null,t0=0,dy=0,el=null;
  const down=e=>{if(!sh.classList.contains('open')||busy||e.target.closest('button'))return;y0=e.clientY;t0=performance.now();dy=0;el=e.currentTarget;sh.classList.add('dragging');el.setPointerCapture(e.pointerId)};
  const move=e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.setProperty('--drag',dy+'px')};
  const up=()=>{if(y0==null)return;const v=dy/Math.max(1,performance.now()-t0);sh.classList.remove('dragging');y0=null;
    if(dy>80||v>.6)closeSheet();else sh.style.setProperty('--drag','0px')};
  ['shGrab','shHead'].forEach(id=>{const n=document.getElementById(id);n.addEventListener('pointerdown',down);n.addEventListener('pointermove',move);n.addEventListener('pointerup',up);n.addEventListener('pointercancel',up)})})();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#ovWrap .modal')){closeOv();return}if($('#ovWrap').children.length)return;closeSheet()}});

function amt(id,max,def){max=Math.max(0,Math.floor(max));
  const ch=[['+1k',1e3],['+10k',1e4],['+100k',1e5],['+1M',1e6]].filter(c=>c[1]<=Math.max(max,1000));
  return `<div class="amt"><div class="amtrow"><input id="${id}" type="number" inputmode="numeric" min="0" value="${Math.max(0,Math.min(Math.floor(def),max))}" aria-label="Montant en euros"><span>€</span></div>
  <div class="chips">${ch.map(c=>`<button class="chip" onclick="amtAdd('${id}',${c[1]},${max})">${c[0]}</button>`).join('')}
  <button class="chip" onclick="amtSet('${id}',${Math.floor(max/2)})" aria-label="La moitié">½</button><button class="chip gold" onclick="amtSet('${id}',${max})">MAX</button><button class="chip" onclick="amtSet('${id}',0)">0</button></div></div>`}
function amtAdd(id,n,max){const e=$('#'+id);if(!e)return;e.value=Math.min(max,(+e.value||0)+n);e.dataset.u='1';sfx.tick()}
function amtSet(id,n){const e=$('#'+id);if(!e)return;e.value=Math.max(0,Math.floor(n));e.dataset.u='1';sfx.tick()}
function getAmt(id){const e=$('#'+id);return e?Math.max(0,Math.floor(+e.value||0)):0}
/* ================= CASINO ================= */
/* Casinos à paliers : chacun a une mise maximale. On débloque le suivant en cumulant, dans le casino actuel,
   un gain net au moins égal à sa mise maximale. Empêche le « tapis » désespéré de fin de partie. */
const CASINOS=[
 {e:'🎱',n:'Le Tripot',d:'Arrière-salle enfumée, tapis troué.',max:500},
 {e:'⚓',n:'Casino du Port',d:'Machines qui clignotent et marins fauchés.',max:2000},
 {e:'🦩',n:'Flamingo Palace',d:'Moquette rose et cocktails fluo.',max:10000},
 {e:'🌴',n:'Golden Riviera',d:'Smokings blancs, vue sur la baie.',max:50000},
 {e:'💎',n:'Le Diamant Noir',d:'Salon privé, sur invitation seulement.',max:250000},
 {e:'👑',n:'Club des Milliardaires',d:'Ici, on ne compte plus.',max:1000000},
];
let cTab='roulette',cSel=0,rl={type:'rouge',num:7},bj=null,scratch=null,lastRes='';
function casLvl(p){return p.casLvl||0}
function casMax(p){return Math.min(Math.max(p.cash,0),CASINOS[cSel].max)}
function openCasino(tab){if(tab)cTab=tab;lastRes='';const p=cur();if(cSel>casLvl(p))cSel=casLvl(p);
  if(!(G.inCasino&&G.casinoLeft>0)&&!hasAP(1))return;
  openSheet('Casinos',casinoHTML(),()=>setBody(casinoHTML()))}
/* Change de salle parmi les casinos débloqués (pas pendant une main de blackjack). */
function casMove(d){const p=cur(),n=cSel+d;if(busy||(bj&&!bj.over)||n<0||n>casLvl(p))return;cSel=n;lastRes='';sfx.tick();refreshSheet()}
function casinoHTML(){const p=cur(),lv=casLvl(p),c=CASINOS[cSel],won=Math.max(0,(p.casWin||[])[cSel]||0),locked=bj&&!bj.over;
  const tabs=[['roulette','Roulette'],['bj','Blackjack'],['slots','Machine à sous'],['scratch','Grattage']];
  let body='';
  if(cTab==='roulette')body=rouletteHTML();else if(cTab==='bj')body=bjHTML();else if(cTab==='slots')body=slotsHTML();else body=scratchHTML();
  const nav=(d,ic,lbl,ok)=>`<button class="iconbtn" aria-label="${lbl}" ${ok?'':'disabled'} onclick="casMove(${d})">${icon(ic)}</button>`;
  return `<div class="casino-head">${nav(-1,'prev','Casino précédent',cSel>0&&!locked)}
    <div class="t"><b>${c.e} ${c.n}</b><span class="small muted">Mise max <span class="num gold">${fmt(c.max)}</span> · salle ${cSel+1}/${CASINOS.length}</span></div>
    ${cSel<lv?nav(1,'arrow','Casino suivant',!locked):cSel<CASINOS.length-1?`<span class="iconbtn" aria-label="Casino suivant verrouillé" role="img">${icon('lock')}</span>`:''}</div>
  ${G.pot>=1000?`<div class="row between small mb-2"><span>Cagnotte commune</span><b class="gold num">${fmt(G.pot)}</b></div>`:''}
  ${note(`${c.d}${cSel===lv&&lv<CASINOS.length-1?` Pour entrer au <b>${CASINOS[lv+1].n}</b> : cumule ${fmt(c.max)} de gains ici (tu en es à <b class="num">${fmt(won)}</b>). Les pertes ne comptent pas.`:''}${locked?' Finis ta main avant de changer de salle.':''}`,'mb-3')}
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${cTab===k}" class="${cTab===k?'on':''}" onclick="if(!busy&&!(bj&&!bj.over)){cTab='${k}';lastRes='';refreshSheet()}">${l}</button>`).join('')}</div>
  <div class="row between small muted mb-3"><span>${G.inCasino&&G.casinoLeft>0?`Parties restantes <b class="num gold">${G.casinoLeft}/${casGames(p)}</b>`:`Entrée <b class="gold">1 PA = ${casGames(p)} parties</b>`}</span><span>Cash <b class="gold num">${fmt(p.cash)}</b></span></div>${body}`}
const casGames=p=>chr(p)==='gambler'?4:3;
function casinoStart(bet){const p=cur();
  if(busy)return false;
  if(bet>CASINOS[cSel].max){toast(`Mise maximale ici : ${fmt(CASINOS[cSel].max)}. Débloque un casino plus huppé.`,1);return false}
  const open=G.inCasino&&G.casinoLeft>0;
  if(!open&&G.ap<1){toast(G.inCasino?'Le videur te raccompagne vers la sortie. Plus de PA pour revenir.':'Plus de points d’action.',1);return false}
  if(!canPay(p,bet))return false;
  if(!open){useAP(1);G.inCasino=true;G.casinoLeft=casGames(p);toast(`Nouvelle soirée au casino : ${casGames(p)} parties pour 1 PA`)}
  G.casinoLeft--;potRoll(p,bet);return true}
/* Cagnotte commune : le casino y reverse 3 % des pertes (roulette, machine à sous, grattage). Chaque partie a une chance
   de la remporter, 1 sur 150 à la mise maximale, proportionnelle à la mise. */
const POT_SHARE=.03,POT_ODDS=150;
function potFeed(loss){if(loss>0&&cTab!=='bj')shared({t:'pot',d:loss*POT_SHARE})}
function potRoll(p,bet){if(!(G.pot>=1000))return;if(Math.random()<(bet/CASINOS[cSel].max)/POT_ODDS){const w=G.pot;shared({t:'pot',d:-w});p.cash+=w;p.stats.casino+=w;
  bigWin(p,w,'rafle la cagnotte commune du casino');toast('JACKPOT ! Tu rafles la cagnotte : '+fmt(w));popMoney(w);G.potTaken=(G.potTaken||0)+w}}
/* Raison pour laquelle on ne peut pas jouer une partie (affichée sous le bouton). */
function casWhy(){const p=cur();if(!(G.inCasino&&G.casinoLeft>0)&&G.ap<1)return 'Plus de points d’action pour entrer';if(p.cash<=0)return 'Plus de cash à miser';return ''}
/* Cumule les gains (jamais les pertes) dans le casino choisi et débloque le suivant dès que le cumul atteint sa mise max. */
function casTrack(p,net,idx){if(idx==null)idx=cSel;if(!(net>0))return;p.casWin=p.casWin||[];p.casWin[idx]=Math.max(0,p.casWin[idx]||0)+net;
  const lv=casLvl(p);if(idx===lv&&lv<CASINOS.length-1&&p.casWin[lv]>=CASINOS[lv].max){p.casLvl=lv+1;const n=CASINOS[lv+1];
    addFeed(`gagne son entrée au ${n.e} ${n.n}`,p);setTimeout(()=>{toast(`${n.n} débloqué : mise max ${fmt(n.max)}`);sfx.big();haptic('unlock')},700)}}
const CGAME={roulette:'à la roulette',bj:'au blackjack',slots:'à la machine à sous',scratch:'au grattage'};
/* gain : gain net de la partie pour le déblocage, si différent du montant crédité (grattage). */
function casinoResult(net,silent,gain){const p=cur();p.cash+=net;p.stats.casino+=net;casTrack(p,gain==null?net:gain);potFeed(-net);
  if(net&&!silent)addFeed(`${net>0?'gagne':'perd'} ${fmt(Math.abs(net))} ${CGAME[cTab]} (${CASINOS[cSel].n})`);
  if(net>0){net>=50000?(sfx.big(),haptic('jackpot')):(sfx.win(),haptic('win'));popMoney(net)}else if(net<0){sfx.lose();haptic('lose')}
  save();render()}
function resBox(win,html){return `<div class="result ${win>0?'w':win<0?'l':''}" role="status">${html}</div>`}
/* roulette */
const REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const RBETS={rouge:['Rouge',2,n=>REDS.includes(n)],noir:['Noir',2,n=>n>0&&!REDS.includes(n)],pair:['Pair',2,n=>n>0&&n%2===0],impair:['Impair',2,n=>n%2===1],
  manque:['1 à 18',2,n=>n>=1&&n<=18],passe:['19 à 36',2,n=>n>=19],d1:['1–12',3,n=>n>=1&&n<=12],d2:['13–24',3,n=>n>=13&&n<=24],d3:['25–36',3,n=>n>=25],plein:['Numéro plein',36,n=>n===rl.num]};
function rColor(n){return n===0?'g':REDS.includes(n)?'r':'b'}
function rouletteHTML(){const p=cur();
  return `<div class="wheel" id="wheel" aria-live="polite">${rl.last!=null?rl.last:'?'}</div>
  <div class="betgrid">${Object.entries(RBETS).filter(([k])=>k!=='plein').map(([k,[l,m]])=>`<button class="${rl.type===k?'on':''}" aria-pressed="${rl.type===k}" onclick="if(!busy){rl.type='${k}';sfx.tick();refreshSheet()}">${l}<small>x${m}</small></button>`).join('')}</div>
  <div class="row mt-2"><div class="betgrid one grow"><button class="${rl.type==='plein'?'on':''}" aria-pressed="${rl.type==='plein'}" onclick="if(!busy){rl.type='plein';refreshSheet()}">Plein sur le <span class="num">${rl.num}</span><small>x36</small></button></div>
    ${iconBtn('prev','Numéro précédent',"if(!busy){rl.num=(rl.num+36)%37;rl.type='plein';refreshSheet()}")}${iconBtn('arrow','Numéro suivant',"if(!busy){rl.num=(rl.num+1)%37;rl.type='plein';refreshSheet()}")}</div>
  <h3 class="sec">Ta mise</h3>${amt('rlAmt',casMax(p),Math.min(1000,casMax(p)))}
  <div id="cres">${lastRes}</div>
  <div class="sheet-foot">${B('Lancer la bille',{v:'primary',on:'spinRoulette()',why:casWhy()})}</div>`}
/* Les animations verrouillent l'écran (busy) ; ce verrou est toujours rendu, même si une erreur survient en route. */
function guarded(fn){return async function(){if(busy)return;try{await fn.apply(this,arguments)}catch(e){console.error(e);busy=false;toast('Petit souci technique : action annulée.',1);try{render()}catch(_){}}finally{busy=false}}}
async function _spinRoulette(){const bet=getAmt('rlAmt');if(!casinoStart(bet))return;busy=true;
  const w=$('#wheel'),final=RI(0,36);let d=40;
  for(let i=0;i<26;i++){const n=i===25?final:RI(0,36);w.textContent=n;w.className='wheel '+rColor(n);sfx.tick();await sleep(d);d*=1.12}
  rl.last=final;const [l,m,test]=RBETS[rl.type];const won=test(final);
